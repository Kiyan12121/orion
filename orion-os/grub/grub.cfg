set default=0
set timeout=4
set timeout_style=menu
insmod all_video
insmod gfxterm
set color_normal=light-cyan/black
set color_highlight=black/light-cyan
set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan
search --no-floppy --set=root --file /casper/vmlinuz

menuentry "ORION OS" {
    linux /casper/vmlinuz boot=casper persistent quiet splash loglevel=3 vt.global_cursor_default=0 ---
    initrd /casper/initrd
}
menuentry "ORION OS - safe graphics (use this if the screen stays black)" {
    linux /casper/vmlinuz boot=casper persistent nomodeset quiet splash ---
    initrd /casper/initrd
}
menuentry "ORION OS - fresh start (nothing is saved)" {
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}
menuentry "Back to Windows / boot from hard drive" {
    exit
}
