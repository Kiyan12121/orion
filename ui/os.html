<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORION OS</title>
<style>
@font-face{font-family:Oxanium;font-weight:300;src:url(fonts/oxanium-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:Oxanium;font-weight:500;src:url(fonts/oxanium-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Oxanium;font-weight:700;src:url(fonts/oxanium-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Instrument;font-weight:400;src:url(fonts/instrument-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Instrument;font-weight:500;src:url(fonts/instrument-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Instrument;font-weight:600;src:url(fonts/instrument-sans-latin-600-normal.woff2) format("woff2")}
:root{
  --space:#050a16; --space2:#0a1630; --frost:#e9f4fb; --mist:#8fa6bd; --dim:#5d7189;
  --glacier:#8be9ff; --mint:#6cffc4; --solar:#ffb23e; --nebula:#9b8cff; --ember:#ff7a6b;
  --glass:rgba(12,24,46,.72); --edge:rgba(139,233,255,.16); --edge2:rgba(139,233,255,.34);
  --disp:Oxanium,"DejaVu Sans",sans-serif; --ui:Instrument,"Noto Sans","DejaVu Sans",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 68% 40%,#0c1d3c 0%,var(--space) 58%,#02050c 100%);color:var(--frost);font:400 15px/1.5 var(--ui);user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--glacier);outline-offset:3px;border-radius:8px}
#sky{position:fixed;inset:0;width:100%;height:100%}

/* ---------- top edge ---------- */
.top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 34px;z-index:5}
.mark{font:500 15px var(--disp);letter-spacing:.42em;color:var(--frost);opacity:.9}
.mark small{font:300 11px var(--disp);letter-spacing:.3em;color:var(--glacier);margin-left:4px}
.tray{margin-left:auto;display:flex;align-items:center;gap:6px}
.tray button{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;color:var(--mist);font:500 13px var(--ui);transition:background .2s,color .2s}
.tray button:hover,.tray button.on{background:rgba(139,233,255,.09);color:var(--frost)}
.tray button[hidden]{display:none}
.tray svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tray .pw:hover{color:var(--ember)}

/* ---------- the left column: time and your day ---------- */
.day{position:fixed;left:7vw;top:15vh;width:min(520px,38vw);z-index:3}
.date{font:500 17px var(--ui);color:var(--mist)}
.clock{font:300 clamp(96px,11vw,168px)/0.92 var(--disp);letter-spacing:-.02em;color:var(--frost);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.clock span{color:var(--glacier);opacity:.55;animation:tick 2s steps(1) infinite}
@keyframes tick{50%{opacity:.15}}
.greet{font:500 24px var(--ui);color:var(--frost)}
.greet em{font-style:normal;color:var(--glacier)}
.today{margin-top:38px;display:flex;flex-direction:column;gap:14px}
.today div{display:grid;grid-template-columns:18px 1fr;gap:12px;align-items:baseline;font:400 16px/1.45 var(--ui);color:var(--frost)}
.today i{width:8px;height:8px;border-radius:50%;margin-top:7px;justify-self:center}
.today small{display:block;color:var(--mist);font-size:13.5px}

/* ---------- talking to ORION ---------- */
.talk{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);width:min(760px,62vw);z-index:6}
.convo{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:34vh;overflow:hidden;justify-content:flex-end;mask-image:linear-gradient(to top,#000 70%,transparent)}
.convo p{font:400 17px/1.55 var(--ui);color:var(--frost);max-width:100%;transition:opacity 1.2s}
.convo p.you{align-self:flex-end;color:var(--mist);font-size:15px;text-align:right;max-width:80%}
.convo p.orion{text-shadow:0 0 24px rgba(5,10,22,.9)}
.convo p.fade{opacity:0}
.convo p .step{display:block;font-size:13px;color:var(--glacier);opacity:.8}
.ask{display:flex;align-items:center;gap:10px;height:62px;padding:0 10px 0 24px;border-radius:31px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.45);transition:border-color .25s,box-shadow .25s}
.ask:focus-within{border-color:var(--edge2);box-shadow:0 18px 60px rgba(0,0,0,.45),0 0 0 6px rgba(139,233,255,.05)}
.ask input{flex:1;background:none;border:0;outline:0;color:var(--frost);font:400 18px var(--ui)}
.ask input::placeholder{color:var(--dim)}
.ask button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mist);transition:background .2s,color .2s}
.ask button:hover{background:rgba(139,233,255,.1);color:var(--frost)}
.ask svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ask .mic.on{background:var(--solar);color:#1a0f00;box-shadow:0 0 0 8px rgba(255,178,62,.15)}
.ask .stop{display:none}.busy .ask .stop{display:grid}

/* ---------- places along the bottom ---------- */
.places{position:fixed;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:4px;z-index:6}
.places button{padding:9px 16px;border-radius:20px;font:500 14.5px var(--ui);color:var(--mist);transition:color .2s,background .2s}
.places button:hover{color:var(--frost);background:rgba(139,233,255,.07)}
.places button.on{color:var(--space);background:var(--glacier)}

/* ---------- a place opens as a sheet over the sky ---------- */
.veil{position:fixed;inset:0;background:rgba(2,5,12,.45);opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:72px;bottom:96px;right:28px;width:min(1180px,74vw);border-radius:24px;background:rgba(6,13,28,.86);border:1px solid var(--edge);backdrop-filter:blur(22px);
  box-shadow:0 30px 90px rgba(0,0,0,.6);transform:translateX(calc(100% + 60px));transition:transform .5s cubic-bezier(.2,.8,.2,1),inset .4s,width .4s;z-index:9;display:flex;flex-direction:column;overflow:hidden}
.sheet.show{transform:none}
.sheet.full{top:0;bottom:0;right:0;width:100vw;border-radius:0}
.sheet header{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px 0 26px;border-bottom:1px solid var(--edge);flex:none}
.sheet header b{font:500 17px var(--disp);letter-spacing:.06em}
.sheet header span{flex:1}
.sheet header button{height:34px;padding:0 12px;border-radius:17px;color:var(--mist);font:500 13px var(--ui)}
.sheet header button:hover{background:rgba(139,233,255,.09);color:var(--frost)}
.sheet .body{flex:1;position:relative;overflow:auto}
#hub{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.full header{display:none}

/* ---------- apps ---------- */
.apps{padding:28px 30px;display:none}
.apps.show{display:block}
.apps input{width:100%;height:50px;padding:0 20px;border-radius:25px;border:1px solid var(--edge);background:rgba(139,233,255,.05);color:var(--frost);font:400 17px var(--ui);outline:0;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid button{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:18px;border-radius:18px;background:rgba(139,233,255,.04);border:1px solid transparent;text-align:left;transition:background .2s,border-color .2s}
.grid button:hover{background:rgba(139,233,255,.09);border-color:var(--edge)}
.grid em{font-style:normal;font-size:28px;line-height:1}
.grid b{font:600 15px var(--ui)}.grid small{display:block;color:var(--mist);font-size:12.5px;font-weight:400}
.running{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.running button{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 16px;border-radius:20px;background:rgba(108,255,196,.08);border:1px solid rgba(108,255,196,.25);font:500 14px var(--ui)}
.running button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--mist)}
.running button i:hover{background:rgba(255,122,107,.2);color:var(--ember)}
.hint{color:var(--mist);font-size:14px;margin-bottom:12px}

/* ---------- control centre ---------- */
.cc{position:fixed;top:66px;right:24px;width:360px;padding:20px;border-radius:22px;background:rgba(8,17,36,.95);border:1px solid var(--edge);backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:12;
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .2s,transform .2s}
.cc.show{opacity:1;transform:none;pointer-events:auto}
.cc h3{font:500 13.5px var(--ui);color:var(--mist);margin:16px 0 8px}
.cc h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:12px}
.row input[type=range]{flex:1;accent-color:var(--glacier);height:4px}
.row output{width:44px;text-align:right;font:500 14px var(--ui);font-variant-numeric:tabular-nums}
.nets{max-height:200px;overflow:auto;margin:0 -8px}
.nets button{display:flex;width:100%;justify-content:space-between;padding:9px 10px;border-radius:10px;font-size:14.5px;text-align:left}
.nets button:hover{background:rgba(139,233,255,.08)}
.nets button.on{color:var(--mint)}
.nets form{display:flex;gap:8px;padding:2px 10px 10px}
.nets form input{flex:1;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--edge2);background:rgba(139,233,255,.06);color:var(--frost);outline:0}
.nets form button{width:auto;padding:0 14px;background:var(--glacier);color:var(--space);border-radius:10px;font-weight:600}
.pwr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.pwr button{padding:12px 6px;border-radius:14px;background:rgba(139,233,255,.06);font:500 13.5px var(--ui);display:flex;flex-direction:column;align-items:center;gap:6px}
.pwr button:hover{background:rgba(139,233,255,.13)}
.pwr button.off{color:#ffb4ab}.pwr button.off:hover{background:rgba(255,122,107,.16)}
.pwr svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.cc .note{font-size:12.5px;color:var(--mist);margin-top:14px;line-height:1.45}

/* ---------- notices ---------- */
.notices{position:fixed;top:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:20;pointer-events:none}
.notice{padding:11px 18px;border-radius:16px;background:rgba(10,22,46,.94);border:1px solid var(--edge);font:500 14.5px var(--ui);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:nin .35s cubic-bezier(.2,.9,.3,1.2);max-width:560px;pointer-events:auto;cursor:pointer}
.notice.warn{border-color:rgba(255,178,62,.5)}
.notice b{color:var(--glacier);font-weight:600}
@keyframes nin{from{opacity:0;transform:translateY(-12px) scale(.96)}}

/* ---------- shutting down / starting up ---------- */
.curtain{position:fixed;inset:0;z-index:40;background:#010309;display:grid;place-items:center;transition:opacity 1.1s}
.curtain.gone{opacity:0;pointer-events:none}
.curtain p{font:300 15px var(--disp);letter-spacing:.5em;color:var(--glacier);opacity:.8}
.confirm{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(2,5,12,.6);backdrop-filter:blur(6px)}
.confirm.show{display:grid}
.confirm div{width:380px;padding:26px;border-radius:22px;background:rgba(8,17,36,.97);border:1px solid var(--edge)}
.confirm h2{font:500 22px var(--disp);margin-bottom:6px}
.confirm p{color:var(--mist);font-size:14.5px}
.confirm nav{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.confirm nav button{height:42px;padding:0 20px;border-radius:21px;font-weight:600}
.confirm .yes{background:var(--ember);color:#1b0503}
.confirm .no:hover{background:rgba(139,233,255,.08)}

@media (max-width:1100px){.day{width:46vw}.talk{width:80vw}.sheet{width:calc(100vw - 40px);right:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="top">
  <div class="mark">ORION<small>OS</small></div>
  <div class="tray">
    <button id="tNet" title="Wi-Fi and sound"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r=".8"/></svg><span id="tNetT">—</span></button>
    <button id="tVol" title="Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="volW" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span id="tVolT"></span></button>
    <button id="tBat" title="Battery" hidden><svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="17" height="10" rx="2"/><path d="M21.5 10.5v3"/></svg><span id="tBatT"></span></button>
    <button class="pw" id="tPow" title="Power"><svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button>
  </div>
</div>

<section class="day" aria-label="Today">
  <div class="date" id="date">—</div>
  <div class="clock" id="clock">--<span>:</span>--</div>
  <div class="greet" id="greet">Hello.</div>
  <div class="today" id="today"></div>
</section>

<section class="talk" aria-label="Ask ORION">
  <div class="convo" id="convo" aria-live="polite"></div>
  <form class="ask" id="ask">
    <input id="q" autocomplete="off" spellcheck="false" placeholder="Ask ORION anything, or tell it what to do">
    <button type="button" class="stop" id="stopB" title="Stop"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
    <button type="button" class="mic" id="micB" title="Talk to ORION"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    <button type="submit" title="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </form>
</section>

<nav class="places" id="places">
  <button data-p="comms">Conversation</button>
  <button data-p="dash">Overview</button>
  <button data-p="sched">Plan</button>
  <button data-p="study">Study</button>
  <button data-p="gaming">Gaming</button>
  <button data-p="ventures">Money</button>
  <button data-p="globe">Globe</button>
  <button data-p="apps">Apps</button>
  <button data-p="settings">Settings</button>
</nav>

<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" aria-label="ORION">
  <header><b id="sheetT">ORION</b><span></span><button id="sheetFull">Fill screen</button><button id="sheetX">Close</button></header>
  <div class="body">
    <iframe id="hub" title="ORION" src="index.html?embed"></iframe>
    <div class="apps" id="apps">
      <div class="running" id="running"></div>
      <input id="appQ" placeholder="Find an app">
      <div class="grid" id="grid"></div>
    </div>
  </div>
</aside>

<div class="cc" id="cc" role="dialog" aria-label="Control centre">
  <h3>Sound</h3><div class="row"><input type="range" id="vol" min="0" max="150"><output id="volO"></output></div>
  <div id="briW"><h3>Brightness</h3><div class="row"><input type="range" id="bri" min="5" max="100"><output id="briO"></output></div></div>
  <h3>Wi-Fi</h3><div class="nets" id="nets"></div>
  <div class="pwr"><button id="pSleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
    <button id="pRe"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Restart</button>
    <button class="off" id="pOff"><svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>Shut down</button></div>
  <p class="note" id="persist"></p>
</div>

<div class="confirm" id="confirm"><div><h2 id="cfT">Shut down?</h2><p id="cfP">ORION will say goodbye and switch the PC off.</p>
  <nav><button class="no" id="cfNo">Cancel</button><button class="yes" id="cfYes">Shut down</button></nav></div></div>

<div class="notices" id="notices"></div>
<div class="curtain" id="curtain"><p>ORION</p></div>
<audio id="voice"></audio>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let api=null, title="sir", mood="idle", level=0, booted=false;

/* ============ the sky: the Orion constellation is ORION ============ */
const STARS=[ // x,y across the figure (0..1), magnitude, colour
  {n:"Meissa",x:.50,y:.06,m:3.3,c:[205,220,255]},{n:"Betelgeuse",x:.27,y:.17,m:.5,c:[255,170,120]},{n:"Bellatrix",x:.69,y:.23,m:1.6,c:[200,220,255]},
  {n:"Alnitak",x:.41,y:.52,m:1.8,c:[200,225,255],belt:1},{n:"Alnilam",x:.50,y:.485,m:1.7,c:[210,230,255],belt:1},{n:"Mintaka",x:.59,y:.45,m:2.2,c:[210,230,255],belt:1},
  {n:"Saiph",x:.35,y:.88,m:2.1,c:[200,220,255]},{n:"Rigel",x:.72,y:.84,m:.13,c:[180,215,255]}];
const LINES=[[0,1],[0,2],[1,3],[2,5],[3,4],[4,5],[3,6],[5,7]];
const sky=$("#sky"), sx=sky.getContext("2d"); let dust=[], t0=performance.now(), boot0=0, pulse=0;
function fitSky(){ const k=Math.min(devicePixelRatio||1,2); sky.width=innerWidth*k; sky.height=innerHeight*k; sky.k=k;
  dust=Array.from({length:Math.round(innerWidth*innerHeight/5200)},()=>({x:Math.random(),y:Math.random(),r:Math.random()**3*1.6+.25,a:Math.random()*.6+.15,tw:Math.random()*6})); }
addEventListener("resize",fitSky); fitSky();
function drawSky(now){ const W=sky.width,H=sky.height,k=sky.k,t=(now-t0)/1000; sx.clearRect(0,0,W,H);
  for(const d of dust){ sx.globalAlpha=d.a*(.7+.3*Math.sin(t*.8+d.tw)); sx.fillStyle="#cfe6ff"; sx.beginPath(); sx.arc(d.x*W,d.y*H,d.r*k,0,7); sx.fill(); }
  sx.globalAlpha=1;
  // the figure sits right of centre, tall
  const fh=Math.min(H*.7,W*.5), fw=fh*.62, ox=W*.67-fw/2, oy=H*.43-fh/2; const P=s=>[ox+s.x*fw, oy+s.y*fh];
  const b=boot0?Math.min(1,(now-boot0)/2600):0;          // startup: stars ignite one by one, then the lines draw
  const lv=mood==="speaking"?level:0, think=mood==="thinking", listen=mood==="listening";
  // lines
  LINES.forEach(([a,c],i)=>{ const p=P(STARS[a]), q=P(STARS[c]); const lb=Math.max(0,Math.min(1,(b-.45-i*.05)/.25)); if(!lb) return;
    const ex=p[0]+(q[0]-p[0])*lb, ey=p[1]+(q[1]-p[1])*lb;
    sx.strokeStyle=`rgba(139,233,255,${.16+(think?.12:0)+lv*.25})`; sx.lineWidth=1.2*k; sx.beginPath(); sx.moveTo(p[0],p[1]); sx.lineTo(ex,ey); sx.stroke();
    if(think&&lb===1){ const f=((t*.55+i*.13)%1); const x=p[0]+(q[0]-p[0])*f, y=p[1]+(q[1]-p[1])*f; const g=sx.createRadialGradient(x,y,0,x,y,14*k); g.addColorStop(0,"rgba(139,233,255,.9)"); g.addColorStop(1,"rgba(139,233,255,0)"); sx.fillStyle=g; sx.fillRect(x-14*k,y-14*k,28*k,28*k); } });
  // the belt speaks: rings flow outward from Alnilam while ORION talks or listens
  const belt=P(STARS[4]);
  if(lv>.02||listen){ for(let r=0;r<3;r++){ const f=(t*.6+r/3)%1, R=(40+f*260)*k*(listen?.8:1); sx.strokeStyle=listen?`rgba(255,178,62,${(1-f)*.35})`:`rgba(139,233,255,${(1-f)*(.18+lv*.5)})`; sx.lineWidth=1.4*k; sx.beginPath(); sx.ellipse(belt[0],belt[1],R,R*.42,-.32,0,7); sx.stroke(); } }
  // two orbits around the belt: ORION's instruments, slowly turning
  if(b>.6){ const ob=Math.min(1,(b-.6)/.4); for(let o=0;o<2;o++){ const R=(o?fh*.30:fh*.21), tilt=o?-.32:.18, rot=t*(o?-.06:.09);
      sx.save(); sx.translate(belt[0],belt[1]); sx.rotate(tilt); sx.scale(1,o?.36:.44);
      sx.strokeStyle=`rgba(139,233,255,${(.07+(think?.06:0)+lv*.12)*ob})`; sx.lineWidth=1*k/(o?.36:.44)*.5; sx.beginPath(); sx.arc(0,0,R,0,7); sx.stroke();
      sx.strokeStyle=`rgba(139,233,255,${(.32+lv*.4)*ob})`; sx.lineWidth=2*k; for(let a=0;a<3;a++){ sx.beginPath(); sx.arc(0,0,R,rot+a*2.1,rot+a*2.1+.38); sx.stroke(); }
      for(let a=0;a<48;a++){ const an=a/48*6.283; const r2=R+(a%4?3:8)*k; sx.strokeStyle=`rgba(139,233,255,${(a%4?.08:.2)*ob})`; sx.lineWidth=k; sx.beginPath(); sx.moveTo(Math.cos(an)*R,Math.sin(an)*R); sx.lineTo(Math.cos(an)*r2,Math.sin(an)*r2); sx.stroke(); }
      const sa=rot*1.7+o*3; sx.fillStyle=o?"#9b8cff":"#8be9ff"; sx.beginPath(); sx.arc(Math.cos(sa)*R,Math.sin(sa)*R,3.2*k/(o?.36:.44)*.45,0,7); sx.fill(); sx.restore(); } }
  // stars
  STARS.forEach((s,i)=>{ const ig=Math.max(0,Math.min(1,(b-i*.05)/.2)); if(!ig) return; const p=P(s);
    let size=(5.2-s.m*1.15)*k*(fh/900)*1.6; size=Math.max(2.2*k,size);
    if(s.belt) size*=1+lv*1.6+(listen?.25*Math.sin(t*5+i):0)+pulse*.6;
    const br=(.8+.2*Math.sin(t*1.3+i*1.7))*ig; const [r,g,bl]=listen&&s.belt?[255,190,90]:s.c;
    const halo=sx.createRadialGradient(p[0],p[1],0,p[0],p[1],size*7); halo.addColorStop(0,`rgba(${r},${g},${bl},${.42*br})`); halo.addColorStop(.25,`rgba(${r},${g},${bl},${.12*br})`); halo.addColorStop(1,`rgba(${r},${g},${bl},0)`);
    sx.fillStyle=halo; sx.fillRect(p[0]-size*7,p[1]-size*7,size*14,size*14);
    sx.fillStyle=`rgba(255,255,255,${br})`; sx.beginPath(); sx.arc(p[0],p[1],size*.55,0,7); sx.fill();
    sx.strokeStyle=`rgba(${r},${g},${bl},${.35*br})`; sx.lineWidth=k; sx.beginPath(); sx.moveTo(p[0]-size*3,p[1]); sx.lineTo(p[0]+size*3,p[1]); sx.moveTo(p[0],p[1]-size*3); sx.lineTo(p[0],p[1]+size*3); sx.stroke();
    if(b>.9&&!s.belt){ sx.font=`500 ${11*k}px Oxanium,sans-serif`; sx.fillStyle=`rgba(143,166,189,${.55*Math.min(1,(b-.9)*10)})`; sx.fillText(s.n,p[0]+size*2.4+6*k,p[1]+4*k); } });
  // M42, the nebula below the belt: ORION's quiet glow
  const m=P({x:.47,y:.66}); const neb=sx.createRadialGradient(m[0],m[1],0,m[0],m[1],fh*.14); neb.addColorStop(0,`rgba(155,140,255,${.16*b+(think?.05:0)})`); neb.addColorStop(1,"rgba(155,140,255,0)"); sx.fillStyle=neb; sx.fillRect(m[0]-fh*.14,m[1]-fh*.14,fh*.28,fh*.28);
  pulse*=.94; level*=.9;
  requestAnimationFrame(drawSky); }
requestAnimationFrame(drawSky);

/* ============ clock and your day ============ */
function tickClock(){ const d=new Date(); $("#clock").innerHTML=`${String(d.getHours()).padStart(2,"0")}<span>:</span>${String(d.getMinutes()).padStart(2,"0")}`;
  $("#date").textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const h=d.getHours(); $("#greet").innerHTML=`${h<5?"Still up":h<12?"Good morning":h<18?"Good afternoon":"Good evening"}, <em>${esc(title)}</em>.`; }
setInterval(tickClock,1000); tickClock();
async function loadDay(){ if(!api) return; try{ const d=await api.saver_data(); const L=[];
    (d.next||[]).slice(0,2).forEach(n=>L.push(["var(--glacier)",esc(n.title),esc(n.at)]));
    if(d.weather) L.push(["var(--nebula)",`${Math.round(d.weather.temp)}° and ${esc(d.weather.sky)}`,d.weather.rain_at?`Rain from ${esc(d.weather.rain_at)}`:esc(d.weather.place||"")]);
    if(d.job) L.push(["var(--mint)",`Working on: ${esc(d.job)}`,d.queued?`${d.queued} more queued`:"" ]);
    if(d.money!=null) L.push(["var(--solar)",`£${(+d.money).toLocaleString("en-GB",{maximumFractionDigits:0})} earned this month`,""]);
    if(!L.length) L.push(["var(--glacier)","Nothing planned yet","Ask ORION to plan your evening"]);
    $("#today").innerHTML=L.map(([c,a,b])=>`<div><i style="background:${c};box-shadow:0 0 10px ${c}"></i><span>${a}${b?`<small>${b}</small>`:""}</span></div>`).join(""); }catch(e){} }

/* ============ conversation ============ */
let cur=null;
function line(cls,html){ const p=document.createElement("p"); p.className=cls; p.innerHTML=html; $("#convo").appendChild(p); while($("#convo").children.length>6) $("#convo").firstChild.remove(); return p; }
function fadeLater(p){ clearTimeout(p._f); p._f=setTimeout(()=>p.classList.add("fade"),45000); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n+/g,"<br>"); }
async function ask(text){ text=(text||"").trim(); if(!text||!api) return; fadeLater(line("you",esc(text))); $("#q").value=""; document.body.classList.add("busy"); mood="thinking";
  try{ await api.send(text); }catch(e){ notice("ORION couldn't take that: "+e.message,"warn"); document.body.classList.remove("busy"); mood="idle"; } }
$("#ask").onsubmit=e=>{ e.preventDefault(); ask($("#q").value); };
$("#stopB").onclick=()=>api&&api.stop();
$("#micB").onclick=()=>{ if(!api) return; if($("#micB").classList.contains("on")) api.mic_stop(); else api.mic_start(); };

/* ============ voice: the belt stars move with ORION's voice ============ */
const voice=$("#voice"); let vq=[], vctx=null, van=null, vbuf=null;
function vplay(){ if(!vq.length||!voice.paused) return; const e=vq.shift(); voice.src="data:audio/mpeg;base64,"+e.b64; voice.play().catch(()=>{}); mood="speaking"; }
voice.onended=()=>{ if(vq.length) vplay(); else if(mood==="speaking") mood="idle"; };
voice.onplay=()=>{ try{ if(!vctx){ vctx=new AudioContext(); const src=vctx.createMediaElementSource(voice); van=vctx.createAnalyser(); van.fftSize=256; vbuf=new Uint8Array(van.frequencyBinCount); src.connect(van); van.connect(vctx.destination); } }catch(e){} };
setInterval(()=>{ if(van&&!voice.paused){ van.getByteFrequencyData(vbuf); let s=0; for(let i=2;i<40;i++) s+=vbuf[i]; level=Math.max(level,Math.min(1,s/40/150)); } },50);

/* ============ events from ORION ============ */
const hub=$("#hub"); const H=()=>hub.contentWindow;
const OVERLAYS=new Set(["globe","holo3d","scan","suitup","powerdown"]);
window.ui={ event(e){ try{ handle(e); }catch(err){} if(e.kind==="audio"||e.kind==="audio_stop") return;
    try{ H().ui&&H().ui.event(e); }catch(err){} } };
function handle(e){ switch(e.kind){
  case "stream_start": cur=line("orion",""); cur._t=""; break;
  case "delta": if(!cur){ cur=line("orion",""); cur._t=""; } cur._t+=e.text; cur.innerHTML=md(cur._t); cur.querySelector(".step")?.remove(); break;
  case "stream_end": if(cur){ cur.innerHTML=md(e.text||cur._t); fadeLater(cur); } cur=null; document.body.classList.remove("busy"); if(mood==="thinking") mood="idle"; pulse=1; break;
  case "message": if(e.role==="assistant"){ fadeLater(line("orion",md(e.text))); } break;
  case "state": if(e.state==="thinking"){ mood="thinking"; document.body.classList.add("busy"); } else if(e.state==="idle"&&mood!=="speaking"){ mood="idle"; document.body.classList.remove("busy"); } break;
  case "tool": if(e.status==="running"&&cur&&!cur._t){ cur.innerHTML=`<span class="step">${esc(e.name.replace(/_/g," "))}…</span>`; } break;
  case "audio": vq.push(e); vplay(); break;
  case "audio_stop": vq=[]; voice.pause(); mood="idle"; break;
  case "speaking": if(!e.on&&voice.paused&&mood==="speaking") mood="idle"; break;
  case "listening": if(e.purpose!=="dictate"){ $("#micB").classList.toggle("on",!!e.on); mood=e.on?"listening":"idle"; } break;
  case "hearing": $("#q").placeholder="“"+e.text+"”"; break;
  case "heard": $("#q").placeholder="Ask ORION anything, or tell it what to do"; $("#micB").classList.remove("on"); fadeLater(line("you",esc(e.text))); mood="thinking"; break;
  case "toast": notice(e.text,e.level); break;
  case "card": if(e.card&&e.card.title) notice(`<b>${esc(e.card.icon||"")} ${esc(e.card.title)}</b>`,"",()=>openPlace("comms")); break;
  case "stopped": document.body.classList.remove("busy"); mood="idle"; break;
  default: if(OVERLAYS.has(e.kind)) openPlace(null,true); } }

function notice(text,level,click){ const n=document.createElement("div"); n.className="notice "+(level==="warn"?"warn":""); n.innerHTML=/<b>/.test(text)?text:esc(text);
  n.onclick=()=>{ n.remove(); click&&click(); }; $("#notices").appendChild(n); setTimeout(()=>n.remove(),6500); while($("#notices").children.length>3) $("#notices").firstChild.remove(); }

/* ============ places ============ */
const NAMES={comms:"Conversation",dash:"Overview",sched:"Plan",study:"Study",gaming:"Gaming",ventures:"Money",apps:"Apps",settings:"Settings",globe:"Globe"};
function openPlace(p,full){ $("#veil").classList.add("show"); $("#sheet").classList.add("show"); $("#sheet").classList.toggle("full",!!full);
  $$("#places button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  const isApps=p==="apps"; $("#apps").classList.toggle("show",isApps); hub.style.visibility=isApps?"hidden":"visible"; $("#sheetT").textContent=NAMES[p]||"ORION";
  try{ if(p==="settings") H().document.querySelector("#nSet").click(); else if(p==="globe") H().globeOpen(null); else if(p&&!isApps) H().go(p); }catch(e){}
  if(isApps){ loadApps(); setTimeout(()=>$("#appQ").focus(),300); } }
function closePlace(){ $("#veil").classList.remove("show"); $("#sheet").classList.remove("show","full"); $$("#places button").forEach(b=>b.classList.remove("on")); $("#q").focus(); }
$$("#places button").forEach(b=>b.onclick=()=>b.classList.contains("on")?closePlace():openPlace(b.dataset.p));
$("#veil").onclick=closePlace; $("#sheetX").onclick=closePlace; $("#sheetFull").onclick=()=>$("#sheet").classList.toggle("full");
addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#cc").classList.contains("show")) $("#cc").classList.remove("show"); else if($("#confirm").classList.contains("show")) $("#confirm").classList.remove("show"); else closePlace(); }
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); } });

/* ============ apps ============ */
let APPS=[];
async function loadApps(){ try{ APPS=await api.os_apps(); }catch(e){ APPS=[]; } paintApps(); paintRunning(); }
function paintApps(){ const q=$("#appQ").value.toLowerCase(); const L=APPS.filter(a=>!q||(a.name+a.desc+a.cat).toLowerCase().includes(q));
  $("#grid").innerHTML=L.map(a=>`<button data-a="${esc(a.id)}"><em>${a.icon}</em><span><b>${esc(a.name)}</b><small>${esc(a.desc||a.cat)}</small></span></button>`).join("")||`<p class="hint">No app called that. Ask ORION to find one instead.</p>`;
  $$("#grid [data-a]").forEach(b=>b.onclick=()=>{ api.os_launch(b.dataset.a); notice("Opening "+b.querySelector("b").textContent+". Press the Windows key to come back to ORION."); closePlace(); }); }
async function paintRunning(){ try{ const s=await api.os_status(); const W=s.windows||[];
  $("#running").innerHTML=W.length?W.map(w=>`<button data-w="${w.id}" title="${esc(w.title)}">${esc(w.title.slice(0,40))}<i data-x="${w.id}" title="Close">✕</i></button>`).join(""):"";
  $$("#running [data-w]").forEach(b=>b.onclick=e=>{ if(e.target.dataset.x){ api.os_window(e.target.dataset.x,"close"); b.remove(); } else api.os_window(b.dataset.w,"focus"); }); }catch(e){} }
$("#appQ").oninput=paintApps; $("#appQ").onkeydown=e=>{ if(e.key==="Enter"){ const b=$("#grid [data-a]"); b&&b.click(); } };

/* ============ control centre ============ */
let ST={};
async function tray(){ if(!api) return; try{ ST=await api.os_status(); }catch(e){ return; }
  $("#tNetT").textContent=ST.wired?"Wired":ST.wifi?ST.wifi.ssid:"Offline"; $("#tNet").style.color=ST.wifi||ST.wired?"":"var(--solar)";
  $("#tVolT").textContent=ST.muted?"Muted":ST.volume+"%"; $("#volW").style.display=ST.muted?"none":"";
  $("#tBat").hidden=!ST.battery; if(ST.battery) $("#tBatT").textContent=(ST.battery.plugged?"⚡ ":"")+ST.battery.pct+"%";
  if(!$("#cc").classList.contains("show")){ $("#vol").value=ST.volume; $("#volO").textContent=ST.volume+"%"; if(ST.brightness!=null){ $("#bri").value=ST.brightness; $("#briO").textContent=ST.brightness+"%"; } }
  $("#briW").hidden=ST.brightness==null;
  $("#persist").textContent=ST.persist?"Your files and settings are saved to the USB stick.":"This is a fresh session: anything you change is lost at shutdown. Rebuild the USB with a persistent partition to keep it."; }
async function nets(){ $("#nets").innerHTML=`<p class="hint" style="padding:0 10px">Looking for networks…</p>`; let L=[]; try{ L=await api.os_wifi(); }catch(e){}
  $("#nets").innerHTML=L.map(n=>`<button class="${n.on?"on":""}" data-s="${esc(n.ssid)}" data-sec="${n.secure?1:0}"><span>${esc(n.ssid)}</span><span>${n.on?"Connected":(n.secure?"🔒 ":"")+n.signal+"%"}</span></button>`).join("")||`<p class="hint" style="padding:0 10px">No networks found. Plug in a cable, or check Wi-Fi is switched on.</p>`;
  $$("#nets [data-s]").forEach(b=>b.onclick=()=>{ if(b.classList.contains("on")) return; $$("#nets form").forEach(f=>f.remove()); if(b.dataset.sec==="0") return join(b.dataset.s,"");
    const f=document.createElement("form"); f.innerHTML=`<input type="password" placeholder="Password for ${esc(b.dataset.s)}"><button>Join</button>`; b.after(f); f.querySelector("input").focus(); f.onsubmit=e=>{ e.preventDefault(); join(b.dataset.s,f.querySelector("input").value); }; }); }
async function join(s,p){ notice("Joining "+s+"…"); const r=await api.os_wifi(s,p); notice(r.ok?"Connected to "+s+".":"Couldn't join "+s+": "+(r.msg||"wrong password?"),r.ok?"":"warn"); nets(); tray(); }
function toggleCC(){ const c=$("#cc"); c.classList.toggle("show"); if(c.classList.contains("show")){ nets(); tray(); } }
$("#tNet").onclick=$("#tVol").onclick=$("#tBat").onclick=e=>{ e.stopPropagation(); toggleCC(); };
document.addEventListener("click",e=>{ const c=$("#cc"); if(c.classList.contains("show")&&!c.contains(e.target)) c.classList.remove("show"); });
$("#vol").oninput=()=>{ $("#volO").textContent=$("#vol").value+"%"; clearTimeout(window._v); window._v=setTimeout(()=>api.os_set({volume:+$("#vol").value}).then(tray),120); };
$("#bri").oninput=()=>{ $("#briO").textContent=$("#bri").value+"%"; clearTimeout(window._b); window._b=setTimeout(()=>api.os_set({brightness:+$("#bri").value}),120); };

/* ============ power ============ */
let pend=null;
function askPower(a){ $("#cc").classList.remove("show"); pend=a; $("#cfT").textContent=a==="restart"?"Restart?":"Shut down?"; $("#cfP").textContent=a==="restart"?"ORION will restart the PC. Anything unsaved in other apps will close.":"ORION will say goodbye and switch the PC off. Anything unsaved in other apps will close.";
  $("#cfYes").textContent=a==="restart"?"Restart":"Shut down"; $("#confirm").classList.add("show"); $("#cfYes").focus(); }
$("#tPow").onclick=e=>{ e.stopPropagation(); toggleCC(); };
$("#pOff").onclick=()=>askPower("shutdown"); $("#pRe").onclick=()=>askPower("restart"); $("#pSleep").onclick=()=>{ $("#cc").classList.remove("show"); api.os_power("sleep"); };
$("#cfNo").onclick=()=>$("#confirm").classList.remove("show");
$("#cfYes").onclick=()=>{ $("#confirm").classList.remove("show"); const c=$("#curtain"); c.querySelector("p").textContent=pend==="restart"?"RESTARTING":"GOODBYE"; c.classList.remove("gone"); api.os_power(pend); };

/* ============ start ============ */
window.OS_HUB=()=>{};
async function start(){ window.OS_API=api; let c={}; try{ c=await api.init(); }catch(e){} title=c.title||"sir";
  tickClock(); loadDay(); tray(); setInterval(loadDay,60000); setInterval(tray,5000);
  setTimeout(()=>{ $("#curtain").classList.add("gone"); boot0=performance.now(); },400);
  setTimeout(()=>$("#q").focus(),1200); }
window.addEventListener("pywebviewready",()=>{ if(api) return; api=window.pywebview.api; start(); });
(function poll(){ if(api) return; const P=window.pywebview; if(P&&P.api&&typeof P.api.init==="function"){ api=P.api; start(); } else setTimeout(poll,250); })();
if(/[?&]preview/.test(location.search)) setTimeout(()=>{ if(api) return; window.OS_PREVIEW=true;   // opened in a normal browser: a pretend ORION so the shell can be previewed
  const A=async v=>v, W=ms=>new Promise(r=>setTimeout(r,ms));
  api={ init:()=>A({title:"sir"}), saver_data:()=>A({weather:{temp:7,sky:"clear",place:"Desford",rain_at:null},next:[{at:"Fri 08:40",title:"Maths mock"},{at:"Fri 16:00",title:"Revise circle theorems"}],job:"",queued:0,money:142}),
    os_status:()=>A({volume:62,muted:false,brightness:null,battery:null,wifi:{ssid:"VM0420-Home",signal:78},wired:false,persist:true,windows:[]}),
    os_apps:()=>A([["epiphany","Web","🌐","Browse the web"],["pcmanfm","Files","📁","Your documents, music and downloads"],["lxterminal","Terminal","⌨","Command line"],["mousepad","Text editor","📝","Write and edit text"],["ristretto","Photos","🖼","View pictures"],["mpv","Media player","🎬","Videos and music"],["galculator","Calculator","🧮","Sums"],["pavucontrol","Sound","🔊","Speakers and microphones"]].map(a=>({id:a[0],name:a[1],icon:a[2],desc:a[3],cat:""}))),
    os_wifi:s=>A(s==null?[{ssid:"VM0420-Home",on:true,signal:78,secure:true},{ssid:"BT-Hub-7K2",on:false,signal:51,secure:true},{ssid:"Desford Library",on:false,signal:22,secure:false}]:{ok:true}),
    os_set:()=>A({}), os_launch:()=>A(true), os_window:()=>A(true), os_power:()=>A(true), stop:()=>A(true), mic_start:()=>{ ui.event({kind:"listening",on:true}); setTimeout(()=>ui.event({kind:"listening",on:false}),4000); return A(true); }, mic_stop:()=>A(true),
    send:async t=>{ ui.event({kind:"state",state:"thinking"}); ui.event({kind:"stream_start",id:"x"}); ui.event({kind:"tool",name:"schedule_list",status:"running"}); await W(900);
      for(const w of "Your maths mock is tomorrow at 8:40, sir. You've got circle theorems pencilled in for four, so I'd do twenty minutes on them tonight and get an early night.".split(" ")){ ui.event({kind:"delta",id:"x",text:w+" "}); await W(40); }
      ui.event({kind:"stream_end",id:"x",text:"Your maths mock is tomorrow at 8:40, sir. You've got circle theorems pencilled in for four, so I'd do twenty minutes on them tonight and get an early night."}); ui.event({kind:"state",state:"idle"}); return true; } };
  api=new Proxy(api,{get:(o,k)=>k in o?o[k]:(async()=>({}))});
  start(); },1200);
</script>
