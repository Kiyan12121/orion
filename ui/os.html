<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORION OS</title>
<style>
@font-face{font-family:Oxanium;font-weight:300;src:url(fonts/oxanium-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:Oxanium;font-weight:500;src:url(fonts/oxanium-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Oxanium;font-weight:700;src:url(fonts/oxanium-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Instrument;font-weight:400;src:url(fonts/instrument-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Instrument;font-weight:500;src:url(fonts/instrument-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Instrument;font-weight:600;src:url(fonts/instrument-sans-latin-600-normal.woff2) format("woff2")}
:root{
  --space:#050a16; --space2:#0a1630; --frost:#e9f4fb; --mist:#8fa6bd; --dim:#5d7189;
  --glacier:#8be9ff; --mint:#6cffc4; --solar:#ffb23e; --nebula:#9b8cff; --ember:#ff7a6b;
  --glass:rgba(12,24,46,.72); --edge:rgba(139,233,255,.16); --edge2:rgba(139,233,255,.34);
  --disp:Oxanium,"DejaVu Sans",sans-serif; --ui:Instrument,"Noto Sans","DejaVu Sans",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 68% 40%,#0c1d3c 0%,var(--space) 58%,#02050c 100%);color:var(--frost);font:400 15px/1.5 var(--ui);user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--glacier);outline-offset:3px;border-radius:8px}
#sky{position:fixed;inset:0;width:100%;height:100%}

/* ---------- top edge ---------- */
.top{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 34px;z-index:5}
.mark{font:500 15px var(--disp);letter-spacing:.42em;color:var(--frost);opacity:.9}
.mark small{font:300 11px var(--disp);letter-spacing:.3em;color:var(--glacier);margin-left:4px}
.tray{margin-left:auto;display:flex;align-items:center;gap:6px}
.tray button{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;color:var(--mist);font:500 13px var(--ui);transition:background .2s,color .2s}
.tray button:hover,.tray button.on{background:rgba(139,233,255,.09);color:var(--frost)}
.tray button[hidden]{display:none}
.tray svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tray .pw:hover{color:var(--ember)}

/* ---------- the left column: time and your day ---------- */
.day{position:fixed;left:7vw;top:15vh;width:min(520px,38vw);z-index:3}
.date{font:500 17px var(--ui);color:var(--mist)}
.clock{font:300 clamp(96px,11vw,168px)/0.92 var(--disp);letter-spacing:-.02em;color:var(--frost);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.clock span{color:var(--glacier);opacity:.55;animation:tick 2s steps(1) infinite}
@keyframes tick{50%{opacity:.15}}
.greet{font:500 24px var(--ui);color:var(--frost)}
.greet em{font-style:normal;color:var(--glacier)}
.today{margin-top:38px;display:flex;flex-direction:column;gap:14px}
.today div{display:grid;grid-template-columns:18px 1fr;gap:12px;align-items:baseline;font:400 16px/1.45 var(--ui);color:var(--frost)}
.today i{width:8px;height:8px;border-radius:50%;margin-top:7px;justify-self:center}
.today small{display:block;color:var(--mist);font-size:13.5px}

/* ---------- talking to ORION ---------- */
.talk{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);width:min(760px,62vw);z-index:6}
.convo{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:34vh;overflow:hidden;justify-content:flex-end;mask-image:linear-gradient(to top,#000 70%,transparent)}
.convo p{font:400 17px/1.55 var(--ui);color:var(--frost);max-width:100%;transition:opacity 1.2s}
.convo p.you{align-self:flex-end;color:var(--mist);font-size:15px;text-align:right;max-width:80%}
.convo p.orion{text-shadow:0 0 24px rgba(5,10,22,.9)}
.convo p.fade{opacity:0}
.convo p .step{display:block;font-size:13px;color:var(--glacier);opacity:.8}
.ask{display:flex;align-items:center;gap:10px;height:62px;padding:0 10px 0 24px;border-radius:31px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.45);transition:border-color .25s,box-shadow .25s}
.ask:focus-within{border-color:var(--edge2);box-shadow:0 18px 60px rgba(0,0,0,.45),0 0 0 6px rgba(139,233,255,.05)}
.ask input{flex:1;background:none;border:0;outline:0;color:var(--frost);font:400 18px var(--ui)}
.ask input::placeholder{color:var(--dim)}
.ask button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mist);transition:background .2s,color .2s}
.ask button:hover{background:rgba(139,233,255,.1);color:var(--frost)}
.ask svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ask .mic.on{background:var(--solar);color:#1a0f00;box-shadow:0 0 0 8px rgba(255,178,62,.15)}
.ask .stop{display:none}.busy .ask .stop{display:grid}

/* ---------- places along the bottom ---------- */
.places{position:fixed;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:4px;z-index:10}
.places button{padding:9px 16px;border-radius:20px;font:500 14.5px var(--ui);color:var(--mist);transition:color .2s,background .2s}
.places button:hover{color:var(--frost);background:rgba(139,233,255,.07)}
.places button.on{color:var(--space);background:var(--glacier)}

/* ---------- a place opens as a sheet over the sky ---------- */
.veil{position:fixed;inset:0;background:rgba(2,5,12,.45);opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:72px;bottom:96px;right:28px;width:min(1180px,74vw);border-radius:24px;background:rgba(6,13,28,.86);border:1px solid var(--edge);backdrop-filter:blur(22px);
  box-shadow:0 30px 90px rgba(0,0,0,.6);transform:translateX(calc(100% + 60px));transition:transform .5s cubic-bezier(.2,.8,.2,1),inset .4s,width .4s;z-index:9;display:flex;flex-direction:column;overflow:hidden}
.sheet.show{transform:none}
.sheet.full{top:0;bottom:0;right:0;width:100vw;border-radius:0}
.sheet header{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px 0 26px;border-bottom:1px solid var(--edge);flex:none}
.sheet header b{font:500 17px var(--disp);letter-spacing:.06em}
.sheet header span{flex:1}
.sheet header button{height:34px;padding:0 12px;border-radius:17px;color:var(--mist);font:500 13px var(--ui)}
.sheet header button:hover{background:rgba(139,233,255,.09);color:var(--frost)}
.sheet .body{flex:1;position:relative;overflow:auto}
#hub{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.full header{display:none}

/* ---------- apps ---------- */
.apps{padding:28px 30px;display:none}
.apps.show{display:block}
.apps input{width:100%;height:50px;padding:0 20px;border-radius:25px;border:1px solid var(--edge);background:rgba(139,233,255,.05);color:var(--frost);font:400 17px var(--ui);outline:0;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid button{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:18px;border-radius:18px;background:rgba(139,233,255,.04);border:1px solid transparent;text-align:left;transition:background .2s,border-color .2s}
.grid button:hover{background:rgba(139,233,255,.09);border-color:var(--edge)}
.grid em{font-style:normal;font-size:28px;line-height:1}
.grid b{font:600 15px var(--ui)}.grid small{display:block;color:var(--mist);font-size:12.5px;font-weight:400}
.running{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.running button{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 16px;border-radius:20px;background:rgba(108,255,196,.08);border:1px solid rgba(108,255,196,.25);font:500 14px var(--ui)}
.running button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--mist)}
.running button i:hover{background:rgba(255,122,107,.2);color:var(--ember)}
.hint{color:var(--mist);font-size:14px;margin-bottom:12px}

/* ---------- control centre ---------- */
.cc{position:fixed;top:66px;right:24px;width:360px;padding:20px;border-radius:22px;background:rgba(8,17,36,.95);border:1px solid var(--edge);backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:12;
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .2s,transform .2s}
.cc.show{opacity:1;transform:none;pointer-events:auto}
.cc h3{font:500 13.5px var(--ui);color:var(--mist);margin:16px 0 8px}
.cc h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:12px}
.row input[type=range]{flex:1;accent-color:var(--glacier);height:4px}
.row output{width:44px;text-align:right;font:500 14px var(--ui);font-variant-numeric:tabular-nums}
.nets{max-height:200px;overflow:auto;margin:0 -8px}
.nets button{display:flex;width:100%;justify-content:space-between;padding:9px 10px;border-radius:10px;font-size:14.5px;text-align:left}
.nets button:hover{background:rgba(139,233,255,.08)}
.nets button.on{color:var(--mint)}
.nets form{display:flex;gap:8px;padding:2px 10px 10px}
.nets form input{flex:1;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--edge2);background:rgba(139,233,255,.06);color:var(--frost);outline:0}
.nets form button{width:auto;padding:0 14px;background:var(--glacier);color:var(--space);border-radius:10px;font-weight:600}
.pwr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.pwr button{padding:12px 6px;border-radius:14px;background:rgba(139,233,255,.06);font:500 13.5px var(--ui);display:flex;flex-direction:column;align-items:center;gap:6px}
.pwr button:hover{background:rgba(139,233,255,.13)}
.pwr button.off{color:#ffb4ab}.pwr button.off:hover{background:rgba(255,122,107,.16)}
.pwr svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.cc .note{font-size:12.5px;color:var(--mist);margin-top:14px;line-height:1.45}

/* ---------- notices ---------- */
.notices{position:fixed;top:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:20;pointer-events:none}
.notice{padding:11px 18px;border-radius:16px;background:rgba(10,22,46,.94);border:1px solid var(--edge);font:500 14.5px var(--ui);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:nin .35s cubic-bezier(.2,.9,.3,1.2);max-width:560px;pointer-events:auto;cursor:pointer}
.notice.warn{border-color:rgba(255,178,62,.5)}
.notice b{color:var(--glacier);font-weight:600}
@keyframes nin{from{opacity:0;transform:translateY(-12px) scale(.96)}}

/* ---------- shutting down / starting up ---------- */
.curtain{position:fixed;inset:0;z-index:40;background:#010309;display:grid;place-items:center;transition:opacity 1.1s}
.curtain.gone{opacity:0;pointer-events:none}
.curtain p{font:300 15px var(--disp);letter-spacing:.5em;color:var(--glacier);opacity:.8}
.confirm{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(2,5,12,.6);backdrop-filter:blur(6px)}
.confirm.show{display:grid}
.confirm>div{width:400px;padding:26px;border-radius:22px;background:rgba(8,17,36,.97);border:1px solid var(--edge)}
.confirm h2{font:500 22px var(--disp);margin-bottom:6px}
.confirm p{color:var(--mist);font-size:14.5px}
.confirm nav{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.confirm nav button{height:42px;padding:0 18px;border-radius:21px;font-weight:600;white-space:nowrap}
.confirm .yes{background:var(--ember);color:#1b0503}
.confirm .no:hover{background:rgba(139,233,255,.08)}


/* ---------- lock screen: the UI dissolves, Orion moves to the centre of the sky ---------- */
.top,.day,.talk,.places{transition:opacity .7s,transform .7s}
body.locked .top,body.locked .day,body.locked .talk,body.locked .places{opacity:0;pointer-events:none}
body.locked .day{transform:translateX(-24px)}body.locked .places{transform:translateY(16px)}
body.locked .sheet,body.locked .veil,body.locked .cc,body.locked .notices{display:none}
.lock{position:fixed;inset:0;z-index:25;display:none;cursor:default}
body.locked .lock{display:block}
.lock .tray{position:absolute;top:0;right:34px;height:64px;color:var(--mist);font:500 13px var(--ui);gap:18px}
.lock .tray span{display:flex;align-items:center;gap:7px}.lock .tray span[hidden]{display:none}.lock .tray em{font-style:normal}
.lock .tray svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lockC{position:absolute;left:0;right:0;top:61vh;text-align:center;animation:lin 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes lin{from{opacity:0;transform:translateY(18px)}}
.lockC .lt{font:300 clamp(84px,10vw,150px)/.9 var(--disp);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.lockC .lt span{color:var(--glacier);opacity:.55}
.lockC .ld{font:500 18px var(--ui);color:var(--mist);margin-top:12px}
.glance{display:flex;justify-content:center;gap:28px;margin-top:26px;color:var(--frost);font-size:14.5px;flex-wrap:wrap;padding:0 40px}
.glance div{display:flex;align-items:center;gap:9px}.glance i{width:7px;height:7px;border-radius:50%}
.glance small{color:var(--mist);font-size:13px;margin-left:2px}
.away{position:absolute;left:34px;bottom:7vh;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:30vw}
.away p{padding:8px 16px;border-radius:14px;background:rgba(10,22,46,.7);border:1px solid var(--edge);font-size:13.5px;color:var(--frost);max-width:520px}
.away h4{font:500 12px var(--ui);color:var(--mist);margin-bottom:2px}
.wake{position:absolute;left:0;right:0;bottom:7vh;text-align:center;color:var(--mist);font-size:14px}
.wake b{color:var(--frost);font-weight:500}
.wake .breath{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--glacier);margin-right:10px;vertical-align:2px;box-shadow:0 0 12px var(--glacier);animation:br 3.2s ease-in-out infinite}
@keyframes br{50%{opacity:.25;transform:scale(.6)}}
.pin{display:none;flex-direction:column;align-items:center;gap:14px}
.lock.askpin .pin{display:flex}.lock.askpin .wakeT{display:none}.glance{transition:opacity .3s}.lock.askpin .glance{opacity:0}
.pin label{font:500 14px var(--ui);color:var(--frost)}
.pin input{width:230px;height:48px;border-radius:24px;border:1px solid var(--edge2);background:rgba(8,18,38,.8);color:var(--frost);text-align:center;font:500 26px var(--disp);letter-spacing:.5em;padding-left:.5em;outline:none}
.pin input::placeholder{letter-spacing:0}.pin input:focus{border-color:var(--glacier);box-shadow:0 0 0 4px rgba(139,233,255,.1)}
.pin.bad input{border-color:var(--ember);animation:shake .4s}
.pin .err{min-height:18px;font-size:13px;color:var(--ember)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
body.unlocking .lock{animation:lout .6s forwards}
@keyframes lout{to{opacity:0;transform:scale(1.03)}}
.cc .lockrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.cc .lockrow button{white-space:nowrap;height:36px;padding:0 14px;border-radius:18px;background:rgba(139,233,255,.08);font-weight:500;font-size:13.5px}
.cc .lockrow button:hover{background:rgba(139,233,255,.16)}
.cc .lockrow select{margin-left:auto;min-width:0;height:36px;border-radius:18px;background:rgba(8,18,38,.9);color:var(--frost);border:1px solid var(--edge);padding:0 10px;font:500 13px var(--ui)}
.confirm input{width:100%;height:44px;margin-top:12px;border-radius:12px;border:1px solid var(--edge2);background:rgba(4,10,22,.8);color:var(--frost);padding:0 14px;font:500 18px var(--disp);letter-spacing:.3em;outline:none}
.confirm input::placeholder{font:400 15px var(--ui);letter-spacing:0;color:var(--dim)}.confirm input:focus{border-color:var(--glacier)}
.confirm .msg{min-height:18px;margin-top:8px;font-size:13px;color:var(--ember)}
.confirm .yes.blue{background:var(--glacier);color:#03131c}

/* ---------- skies ---------- */
body.sky-deep{background:#000}
body.sky-dawn{background:radial-gradient(130% 80% at 60% 120%,#5a2a4a 0%,#2a1838 30%,#0b1027 62%,#03050c 100%)}
body.sky-aurora{background:radial-gradient(120% 90% at 50% 10%,#06222c 0%,#041222 50%,#02050c 100%)}
.cc .skies{display:flex;gap:10px}
.cc .skies button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12.5px var(--ui);color:var(--mist);padding:6px 0;border-radius:12px}
.cc .skies button i{width:44px;height:30px;border-radius:9px;border:1px solid var(--edge);display:block}
.cc .skies button.on{color:var(--frost)}.cc .skies button.on i{border-color:var(--glacier);box-shadow:0 0 0 3px rgba(139,233,255,.18)}
.cc .skies button:hover{background:rgba(139,233,255,.06)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.stats div{padding:9px 10px;border-radius:12px;background:rgba(139,233,255,.05)}
.stats b{display:block;font:500 17px var(--disp);font-variant-numeric:tabular-nums}
.stats small{font-size:11.5px;color:var(--mist)}
.stats .hot b{color:var(--solar)}
.cc{max-height:calc(100vh - 84px);overflow:auto}
.cc .quick{display:flex;gap:8px;margin-top:10px}
.cc .quick button{flex:1;height:38px;border-radius:12px;background:rgba(139,233,255,.06);font:500 13.5px var(--ui);display:flex;align-items:center;justify-content:center;gap:8px}
.cc .quick button:hover{background:rgba(139,233,255,.13)}
.cc .quick svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- notification centre ---------- */
.tray .bell{position:relative}
.tray .bell em{position:absolute;top:4px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--glacier);color:var(--space);font:700 10.5px/16px var(--ui);font-style:normal;text-align:center}
.tray .bell em:empty{display:none}
body.dnd .tray .bell{color:var(--nebula)}
.nc{right:24px;width:380px}
.nc .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.nc .head h3{margin:0;flex:1}
.nc .head button{height:32px;padding:0 12px;border-radius:16px;font:500 13px var(--ui);color:var(--mist)}
.nc .head button:hover{background:rgba(139,233,255,.08);color:var(--frost)}
.nc .head button.on{background:rgba(155,140,255,.18);color:#cfc8ff}
.nlist{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.nlist div{padding:10px 12px;border-radius:12px;background:rgba(139,233,255,.05);font-size:14px;line-height:1.4}
.nlist small{display:block;color:var(--mist);font-size:12px;margin-top:2px}
.nlist .warn{background:rgba(255,178,62,.08)}
.nlist p{color:var(--mist);font-size:14px;padding:18px 4px;text-align:center}

/* ---------- files ---------- */
.files{padding:24px 30px;display:none}
.files.show{display:block}
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fbar button{height:34px;padding:0 14px;border-radius:17px;background:rgba(139,233,255,.05);font:500 13.5px var(--ui);color:var(--mist)}
.fbar button:hover,.fbar button.on{background:rgba(139,233,255,.13);color:var(--frost)}
.crumbs{display:flex;align-items:center;gap:4px;font:500 15px var(--ui);margin-bottom:12px;color:var(--mist);flex-wrap:wrap}
.crumbs button{padding:4px 8px;border-radius:8px}.crumbs button:hover{background:rgba(139,233,255,.08);color:var(--frost)}
.crumbs button:last-child{color:var(--frost)}
.flist{display:flex;flex-direction:column}
.flist button{display:grid;grid-template-columns:34px 1fr 90px 110px;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;text-align:left;font-size:14.5px}
.flist button:hover{background:rgba(139,233,255,.07)}
.flist em{font-style:normal;font-size:20px}
.flist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist small{color:var(--mist);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- countdown ---------- */
.count{position:fixed;top:24px;left:50%;transform:translate(-50%,-140%);z-index:45;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 22px;border-radius:22px;
  background:rgba(14,10,22,.96);border:1px solid rgba(255,122,107,.45);box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
.count.show{transform:translate(-50%,0)}
.count p{font:500 15px var(--ui)}.count p b{font:500 20px var(--disp);color:#ffb4ab;font-variant-numeric:tabular-nums;margin:0 2px}
.count small{display:block;font-size:12.5px;color:var(--mist)}
.count button{height:40px;padding:0 18px;border-radius:20px;font-weight:600;white-space:nowrap}
.count .keep{background:var(--glacier);color:#03131c}

/* ---------- farewell ---------- */
body.leaving .top,body.leaving .day,body.leaving .talk,body.leaving .places,body.leaving .lock,body.leaving .notices,body.leaving .sheet,body.leaving .veil,body.leaving .cc,body.leaving .count{opacity:0!important;pointer-events:none!important;transition:opacity .6s}
.bye{position:fixed;left:0;right:0;top:66vh;text-align:center;z-index:46;pointer-events:none;opacity:0;transition:opacity 1.2s}
.bye.show{opacity:1}
.bye p{font:300 30px var(--disp);letter-spacing:.32em;color:var(--frost);padding-left:.32em}
.bye small{display:block;margin-top:14px;font:400 14px var(--ui);color:var(--mist);letter-spacing:.04em}
body.gone-dark{cursor:none}
@media (max-width:1100px){.day{width:46vw}.talk{width:80vw}.sheet{width:calc(100vw - 40px);right:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let api=null, title="sir", mood="idle", level=0, booted=false, locked=false, lk=0, missed=[], skyT="night", fare=0, fareK="shutdown";

/* ============ the sky: the Orion constellation is ORION ============ */
const STARS=[ // x,y across the figure (0..1), magnitude, colour
  {n:"Meissa",x:.50,y:.06,m:3.3,c:[205,220,255]},{n:"Betelgeuse",x:.27,y:.17,m:.5,c:[255,170,120]},{n:"Bellatrix",x:.69,y:.23,m:1.6,c:[200,220,255]},
  {n:"Alnitak",x:.41,y:.52,m:1.8,c:[200,225,255],belt:1},{n:"Alnilam",x:.50,y:.485,m:1.7,c:[210,230,255],belt:1},{n:"Mintaka",x:.59,y:.45,m:2.2,c:[210,230,255],belt:1},
  {n:"Saiph",x:.35,y:.88,m:2.1,c:[200,220,255]},{n:"Rigel",x:.72,y:.84,m:.13,c:[180,215,255]}];
const LINES=[[0,1],[0,2],[1,3],[2,5],[3,4],[4,5],[3,6],[5,7]];
const sky=$("#sky"), sx=sky.getContext("2d"); let dust=[], t0=performance.now(), boot0=0, pulse=0;
function fitSky(){ const k=Math.min(devicePixelRatio||1,2); sky.width=innerWidth*k; sky.height=innerHeight*k; sky.k=k;
  dust=Array.from({length:Math.round(innerWidth*innerHeight/5200)},()=>({x:Math.random(),y:Math.random(),r:Math.random()**3*1.6+.25,a:Math.random()*.6+.15,tw:Math.random()*6})); }
addEventListener("resize",fitSky); fitSky();
function drawSky(now){ const W=sky.width,H=sky.height,k=sky.k,t=(now-t0)/1000; sx.clearRect(0,0,W,H);
  const F=fare?Math.min(1.25,(now-fare)/3000):0, live=1-Math.min(1,F*1.4);
  if(skyT==="aurora"){ for(let r=0;r<4;r++){ const hue=r%2?[108,255,196]:[139,233,255]; sx.beginPath(); const y0=H*(.16+r*.05);
      for(let x=0;x<=W;x+=W/60){ const y=y0+Math.sin(x/W*6+t*.25+r*1.7)*H*.04+Math.sin(x/W*13-t*.4+r)*H*.015; x?sx.lineTo(x,y):sx.moveTo(x,y); }
      for(let x=W;x>=0;x-=W/60){ const y=y0+H*(.18+.06*Math.sin(x/W*4+t*.2+r))+Math.sin(x/W*6+t*.25+r*1.7)*H*.04; sx.lineTo(x,y); }
      const g=sx.createLinearGradient(0,y0-H*.05,0,y0+H*.25); g.addColorStop(0,`rgba(${hue},0)`); g.addColorStop(.25,`rgba(${hue},${.10*live})`); g.addColorStop(1,`rgba(${hue},0)`); sx.fillStyle=g; sx.fill(); } }
  if(skyT==="dawn"){ const g=sx.createRadialGradient(W*.6,H*1.15,0,W*.6,H*1.15,H*.9); g.addColorStop(0,`rgba(255,160,110,${.32*live})`); g.addColorStop(.5,`rgba(200,90,120,${.12*live})`); g.addColorStop(1,"rgba(0,0,0,0)"); sx.fillStyle=g; sx.fillRect(0,0,W,H); }
  for(const d of dust){ if(skyT==="deep"&&d.r<.5) continue; sx.globalAlpha=d.a*(.7+.3*Math.sin(t*.8+d.tw))*live; sx.fillStyle="#cfe6ff"; sx.beginPath(); sx.arc(d.x*W,d.y*H,d.r*k,0,7); sx.fill(); }
  sx.globalAlpha=1;
  // the figure sits right of centre, tall
  lk+=((locked||fare?1:0)-lk)*(fare?.09:.06); const fh=Math.min(H*.7,W*.5)*(1-lk*.4), fw=fh*.62, ox=W*(.67-lk*.17)-fw/2, oy=H*(.43-lk*.07)-fh/2; const P0=s=>[ox+s.x*fw, oy+s.y*fh], bz=P0(STARS[4]), ce=Math.min(1,Math.max(0,F/.72)), cq=ce*ce*(3-2*ce);
  const P=s=>{ const p=P0(s); return F?[p[0]+(bz[0]-p[0])*cq, p[1]+(bz[1]-p[1])*cq]:p; };
  const b=boot0?Math.min(1,(now-boot0)/2600):0;          // startup: stars ignite one by one, then the lines draw
  const lv=mood==="speaking"?level:0, think=mood==="thinking", listen=mood==="listening";
  // lines
  LINES.forEach(([a,c],i)=>{ const p=P(STARS[a]), q=P(STARS[c]); const lb=Math.max(0,Math.min(1,(b-.45-i*.05)/.25)); if(!lb) return;
    const ex=p[0]+(q[0]-p[0])*lb, ey=p[1]+(q[1]-p[1])*lb;
    sx.strokeStyle=`rgba(139,233,255,${(.16+(think?.12:0)+lv*.25)*live})`; sx.lineWidth=1.2*k; sx.beginPath(); sx.moveTo(p[0],p[1]); sx.lineTo(ex,ey); sx.stroke();
    if(think&&lb===1){ const f=((t*.55+i*.13)%1); const x=p[0]+(q[0]-p[0])*f, y=p[1]+(q[1]-p[1])*f; const g=sx.createRadialGradient(x,y,0,x,y,14*k); g.addColorStop(0,"rgba(139,233,255,.9)"); g.addColorStop(1,"rgba(139,233,255,0)"); sx.fillStyle=g; sx.fillRect(x-14*k,y-14*k,28*k,28*k); } });
  // the belt speaks: rings flow outward from Alnilam while ORION talks or listens
  const belt=P(STARS[4]);
  if(lv>.02||listen){ for(let r=0;r<3;r++){ const f=(t*.6+r/3)%1, R=(40+f*260)*k*(listen?.8:1); sx.strokeStyle=listen?`rgba(255,178,62,${(1-f)*.35})`:`rgba(139,233,255,${(1-f)*(.18+lv*.5)})`; sx.lineWidth=1.4*k; sx.beginPath(); sx.ellipse(belt[0],belt[1],R,R*.42,-.32,0,7); sx.stroke(); } }
  // two orbits around the belt: ORION's instruments, slowly turning
  if(b>.6){ const ob=Math.min(1,(b-.6)/.4); for(let o=0;o<2;o++){ const R=(o?fh*.30:fh*.21)*(1-cq*.96)+.01, tilt=o?-.32:.18, rot=t*(o?-.06:.09)*(1+F*14);
      sx.save(); sx.translate(belt[0],belt[1]); sx.rotate(tilt); sx.scale(1,o?.36:.44);
      sx.strokeStyle=`rgba(139,233,255,${(.07+(think?.06:0)+lv*.12)*ob*live})`; sx.lineWidth=1*k/(o?.36:.44)*.5; sx.beginPath(); sx.arc(0,0,R,0,7); sx.stroke();
      sx.strokeStyle=`rgba(139,233,255,${(.32+lv*.4)*ob*(1-Math.min(1,F))})`; sx.lineWidth=2*k; for(let a=0;a<3;a++){ sx.beginPath(); sx.arc(0,0,R,rot+a*2.1,rot+a*2.1+.38); sx.stroke(); }
      for(let a=0;a<48;a++){ const an=a/48*6.283; const r2=R+(a%4?3:8)*k; sx.strokeStyle=`rgba(139,233,255,${(a%4?.08:.2)*ob*live})`; sx.lineWidth=k; sx.beginPath(); sx.moveTo(Math.cos(an)*R,Math.sin(an)*R); sx.lineTo(Math.cos(an)*r2,Math.sin(an)*r2); sx.stroke(); }
      const sa=rot*1.7+o*3; if(F<.6){ sx.fillStyle=o?"#9b8cff":"#8be9ff"; sx.beginPath(); sx.arc(Math.cos(sa)*R,Math.sin(sa)*R,3.2*k/(o?.36:.44)*.45,0,7); sx.fill(); } sx.restore(); } }
  // stars
  STARS.forEach((s,i)=>{ const ig=Math.max(0,Math.min(1,(b-i*.05)/.2)); if(!ig) return; const p=P(s);
    let size=(5.2-s.m*1.15)*k*(fh/900)*1.6; size=Math.max(2.2*k,size);
    if(s.belt) size*=1+lv*1.6+(listen?.25*Math.sin(t*5+i):0)+pulse*.6;
    const br=(.8+.2*Math.sin(t*1.3+i*1.7))*ig*(F>.72?Math.max(0,1-(F-.72)*5):1); const [r,g,bl]=listen&&s.belt?[255,190,90]:s.c;
    const halo=sx.createRadialGradient(p[0],p[1],0,p[0],p[1],size*7); halo.addColorStop(0,`rgba(${r},${g},${bl},${.42*br})`); halo.addColorStop(.25,`rgba(${r},${g},${bl},${.12*br})`); halo.addColorStop(1,`rgba(${r},${g},${bl},0)`);
    sx.fillStyle=halo; sx.fillRect(p[0]-size*7,p[1]-size*7,size*14,size*14);
    sx.fillStyle=`rgba(255,255,255,${br})`; sx.beginPath(); sx.arc(p[0],p[1],size*.55,0,7); sx.fill();
    sx.strokeStyle=`rgba(${r},${g},${bl},${.35*br})`; sx.lineWidth=k; sx.beginPath(); sx.moveTo(p[0]-size*3,p[1]); sx.lineTo(p[0]+size*3,p[1]); sx.moveTo(p[0],p[1]-size*3); sx.lineTo(p[0],p[1]+size*3); sx.stroke();
    if(b>.9&&!s.belt&&!F){ sx.font=`500 ${11*k}px Oxanium,sans-serif`; sx.fillStyle=`rgba(143,166,189,${.55*Math.min(1,(b-.9)*10)})`; sx.fillText(s.n,p[0]+size*2.4+6*k,p[1]+4*k); } });
  // M42, the nebula below the belt: ORION's quiet glow
  const m=P({x:.47,y:.66}); const neb=sx.createRadialGradient(m[0],m[1],0,m[0],m[1],fh*.14); neb.addColorStop(0,`rgba(155,140,255,${(.16*b+(think?.05:0))*live})`); neb.addColorStop(1,"rgba(155,140,255,0)"); sx.fillStyle=neb; sx.fillRect(m[0]-fh*.14,m[1]-fh*.14,fh*.28,fh*.28);
  if(F>.62){ const q=(F-.62)/.6, big=Math.sin(Math.min(1,q/.45)*Math.PI), rad=Math.max(1,(fh*.42*big+6*k)*(q>.45?Math.max(0,1-(q-.45)*1.9):1));
    const g=sx.createRadialGradient(bz[0],bz[1],0,bz[0],bz[1],rad); g.addColorStop(0,`rgba(255,255,255,${Math.max(0,1-q*.85)})`); g.addColorStop(.18,`rgba(139,233,255,${.55*Math.max(0,1-q)})`); g.addColorStop(1,"rgba(139,233,255,0)");
    sx.fillStyle=g; sx.fillRect(bz[0]-rad,bz[1]-rad,rad*2,rad*2); }

  requestAnimationFrame(drawSky); }
requestAnimationFrame(drawSky);

/* ============ clock and your day ============ */
function tickClock(){ const d=new Date(); $("#clock").innerHTML=`${String(d.getHours()).padStart(2,"0")}<span>:</span>${String(d.getMinutes()).padStart(2,"0")}`;
  $("#date").textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const h=d.getHours(); $("#greet").innerHTML=`${h<5?"Still up":h<12?"Good morning":h<18?"Good afternoon":"Good evening"}, <em>${esc(title)}</em>.`; }
setInterval(tickClock,1000); tickClock();
async function loadDay(){ if(!api) return; try{ const d=await api.saver_data(); const L=[];
    (d.next||[]).slice(0,2).forEach(n=>L.push(["var(--glacier)",esc(n.title),esc(n.at)]));
    if(d.weather) L.push(["var(--nebula)",`${Math.round(d.weather.temp)}° and ${esc(d.weather.sky)}`,d.weather.rain_at?`Rain from ${esc(d.weather.rain_at)}`:esc(d.weather.place||"")]);
    if(d.job) L.push(["var(--mint)",`Working on: ${esc(d.job)}`,d.queued?`${d.queued} more queued`:"" ]);
    if(d.money!=null) L.push(["var(--solar)",`£${(+d.money).toLocaleString("en-GB",{maximumFractionDigits:0})} earned this month`,""]);
    if(!L.length) L.push(["var(--glacier)","Nothing planned yet","Ask ORION to plan your evening"]);
    dayL=L; if(locked) paintGlance(); $("#today").innerHTML=L.map(([c,a,b])=>`<div><i style="background:${c};box-shadow:0 0 10px ${c}"></i><span>${a}${b?`<small>${b}</small>`:""}</span></div>`).join(""); }catch(e){} }

/* ============ conversation ============ */
let cur=null;
function line(cls,html){ const p=document.createElement("p"); p.className=cls; p.innerHTML=html; $("#convo").appendChild(p); while($("#convo").children.length>6) $("#convo").firstChild.remove(); return p; }
function fadeLater(p){ clearTimeout(p._f); p._f=setTimeout(()=>p.classList.add("fade"),45000); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n+/g,"<br>"); }
async function ask(text){ text=(text||"").trim(); if(!text||!api) return; fadeLater(line("you",esc(text))); $("#q").value=""; document.body.classList.add("busy"); mood="thinking";
  try{ await api.send(text); }catch(e){ notice("ORION couldn't take that: "+e.message,"warn"); document.body.classList.remove("busy"); mood="idle"; } }
$("#ask").onsubmit=e=>{ e.preventDefault(); ask($("#q").value); };
$("#stopB").onclick=()=>api&&api.stop();
$("#micB").onclick=()=>{ if(!api) return; if($("#micB").classList.contains("on")) api.mic_stop(); else api.mic_start(); };

/* ============ voice: the belt stars move with ORION's voice ============ */
const voice=$("#voice"); let vq=[], vctx=null, van=null, vbuf=null;
function vplay(){ if(!vq.length||!voice.paused) return; const e=vq.shift(); voice.src="data:audio/mpeg;base64,"+e.b64; voice.play().catch(()=>{}); mood="speaking"; }
voice.onended=()=>{ if(vq.length) vplay(); else if(mood==="speaking") mood="idle"; };
voice.onplay=()=>{ try{ if(!vctx){ vctx=new AudioContext(); const src=vctx.createMediaElementSource(voice); van=vctx.createAnalyser(); van.fftSize=256; vbuf=new Uint8Array(van.frequencyBinCount); src.connect(van); van.connect(vctx.destination); } }catch(e){} };
setInterval(()=>{ if(van&&!voice.paused){ van.getByteFrequencyData(vbuf); let s=0; for(let i=2;i<40;i++) s+=vbuf[i]; level=Math.max(level,Math.min(1,s/40/150)); } },50);

/* ============ events from ORION ============ */
const hub=$("#hub"); const H=()=>hub.contentWindow;
const OVERLAYS=new Set(["globe","holo3d","scan","suitup"]);
window.ui={ event(e){ try{ handle(e); }catch(err){} if(e.kind==="audio"||e.kind==="audio_stop") return;
    try{ H().ui&&H().ui.event(e); }catch(err){} } };
function handle(e){ switch(e.kind){
  case "stream_start": cur=line("orion",""); cur._t=""; break;
  case "delta": if(!cur){ cur=line("orion",""); cur._t=""; } cur._t+=e.text; cur.innerHTML=md(cur._t); cur.querySelector(".step")?.remove(); break;
  case "stream_end": if(cur){ cur.innerHTML=md(e.text||cur._t); fadeLater(cur); } cur=null; document.body.classList.remove("busy"); if(mood==="thinking") mood="idle"; pulse=1; break;
  case "message": if(e.role==="assistant"){ fadeLater(line("orion",md(e.text))); } break;
  case "state": if(e.state==="thinking"){ mood="thinking"; document.body.classList.add("busy"); } else if(e.state==="idle"&&mood!=="speaking"){ mood="idle"; document.body.classList.remove("busy"); } break;
  case "tool": if(e.status==="running"&&cur&&!cur._t){ cur.innerHTML=`<span class="step">${esc(e.name.replace(/_/g," "))}…</span>`; } break;
  case "audio": vq.push(e); vplay(); break;
  case "audio_stop": vq=[]; voice.pause(); mood="idle"; break;
  case "speaking": if(!e.on&&voice.paused&&mood==="speaking") mood="idle"; break;
  case "listening": if(e.purpose!=="dictate"){ $("#micB").classList.toggle("on",!!e.on); mood=e.on?"listening":"idle"; } break;
  case "hearing": $("#q").placeholder="“"+e.text+"”"; break;
  case "heard": $("#q").placeholder="Ask ORION anything, or tell it what to do"; $("#micB").classList.remove("on"); fadeLater(line("you",esc(e.text))); mood="thinking"; break;
  case "toast": notice(e.text,e.level); break;
  case "card": if(e.card&&e.card.title) notice(`<b>${esc(e.card.icon||"")} ${esc(e.card.title)}</b>`,"",()=>openPlace("comms")); break;
  case "stopped": document.body.classList.remove("busy"); mood="idle"; break;
  case "os_lock": lock(); break;
  case "os_power_countdown": countdown(e.action,e.seconds||60,e.name); break;
  case "os_sky": setSky(e.sky); break;
  case "powerdown": farewell(e.action); break;
  default: if(OVERLAYS.has(e.kind)) openPlace(null,true); } }

function notice(text,level,click){ remember(text,level); if(dnd&&level!=="force") return; if(locked){ missed.push(text.replace(/<[^>]+>/g,"")); paintAway(); return; } const n=document.createElement("div"); n.className="notice "+(level==="warn"?"warn":""); n.innerHTML=/<b>/.test(text)?text:esc(text);
  n.onclick=()=>{ n.remove(); click&&click(); }; $("#notices").appendChild(n); setTimeout(()=>n.remove(),6500); while($("#notices").children.length>3) $("#notices").firstChild.remove(); }

/* ============ places ============ */
const NAMES={files:"Files",shift:"Automate",comms:"Conversation",dash:"Overview",sched:"Plan",study:"Study",gaming:"Gaming",ventures:"Money",apps:"Apps",settings:"Settings",globe:"Globe"};
function openPlace(p,full){ $("#veil").classList.add("show"); $("#sheet").classList.add("show"); $("#sheet").classList.toggle("full",!!full);
  $$("#places button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  const isApps=p==="apps", isFiles=p==="files", local=isApps||isFiles; $("#apps").classList.toggle("show",isApps); $("#files").classList.toggle("show",isFiles); hub.style.visibility=local?"hidden":"visible"; $("#sheetT").textContent=NAMES[p]||"ORION";
  try{ if(p==="settings") H().document.querySelector("#nSet").click(); else if(p==="globe") H().globeOpen(null); else if(p==="shift"){ H().go("shift"); setTimeout(()=>{ try{ const a=H().document.querySelector("#atList"); a&&a.scrollIntoView({block:"start"}); }catch(e){} },400); } else if(p&&!local) H().go(p); }catch(e){}
  if(isFiles) loadFiles(FPATH);
  if(isApps){ loadApps(); setTimeout(()=>$("#appQ").focus(),300); } }
function closePlace(quiet){ $("#veil").classList.remove("show"); $("#sheet").classList.remove("show","full"); $$("#places button").forEach(b=>b.classList.remove("on")); if(!quiet) $("#q").focus(); }
$$("#places button").forEach(b=>b.onclick=()=>b.classList.contains("on")?closePlace():openPlace(b.dataset.p));
$("#veil").onclick=closePlace; $("#sheetX").onclick=closePlace; $("#sheetFull").onclick=()=>$("#sheet").classList.toggle("full");
addEventListener("keydown",e=>{ if(e.key==="Escape"){ $("#nc").classList.remove("show"); if($("#cc").classList.contains("show")) $("#cc").classList.remove("show"); else if($("#confirm").classList.contains("show")) $("#confirm").classList.remove("show"); else closePlace(); }
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); } });

/* ============ apps ============ */
let APPS=[];
async function loadApps(){ try{ APPS=await api.os_apps(); }catch(e){ APPS=[]; } paintApps(); paintRunning(); }
function paintApps(){ const q=$("#appQ").value.toLowerCase(); const L=APPS.filter(a=>!q||(a.name+a.desc+a.cat).toLowerCase().includes(q));
  $("#grid").innerHTML=L.map(a=>`<button data-a="${esc(a.id)}"><em>${a.icon}</em><span><b>${esc(a.name)}</b><small>${esc(a.desc||a.cat)}</small></span></button>`).join("")||`<p class="hint">No app called that. Ask ORION to find one instead.</p>`;
  $$("#grid [data-a]").forEach(b=>b.onclick=()=>{ api.os_launch(b.dataset.a); notice("Opening "+b.querySelector("b").textContent+". Press the Windows key to come back to ORION."); closePlace(); }); }
async function paintRunning(){ try{ const s=await api.os_status(); const W=s.windows||[];
  $("#running").innerHTML=W.length?W.map(w=>`<button data-w="${w.id}" title="${esc(w.title)}">${esc(w.title.slice(0,40))}<i data-x="${w.id}" title="Close">✕</i></button>`).join(""):"";
  $$("#running [data-w]").forEach(b=>b.onclick=e=>{ if(e.target.dataset.x){ api.os_window(e.target.dataset.x,"close"); b.remove(); } else api.os_window(b.dataset.w,"focus"); }); }catch(e){} }
$("#appQ").oninput=paintApps; $("#appQ").onkeydown=e=>{ if(e.key==="Enter"){ const b=$("#grid [data-a]"); b&&b.click(); } };

/* ============ control centre ============ */
let ST={};
async function tray(){ if(!api) return; try{ ST=await api.os_status(); }catch(e){ return; }
  $("#tNetT").textContent=ST.wired?"Wired":ST.wifi?ST.wifi.ssid:"Offline"; $("#tNet").style.color=ST.wifi||ST.wired?"":"var(--solar)";
  $("#tVolT").textContent=ST.muted?"Muted":ST.volume+"%"; $("#volW").style.display=ST.muted?"none":"";
  $("#tBat").hidden=!ST.battery; if(ST.battery) $("#tBatT").textContent=(ST.battery.plugged?"⚡ ":"")+ST.battery.pct+"%";
  if(!$("#cc").classList.contains("show")){ $("#vol").value=ST.volume; $("#volO").textContent=ST.volume+"%"; if(ST.brightness!=null){ $("#bri").value=ST.brightness; $("#briO").textContent=ST.brightness+"%"; } }
  $("#briW").hidden=ST.brightness==null;
  $("#persist").textContent=ST.persist?"Your files and settings are saved to the USB stick.":"This is a fresh session: anything you change is lost at shutdown. Rebuild the USB with a persistent partition to keep it."; }
async function nets(){ $("#nets").innerHTML=`<p class="hint" style="padding:0 10px">Looking for networks…</p>`; let L=[]; try{ L=await api.os_wifi(); }catch(e){}
  $("#nets").innerHTML=L.map(n=>`<button class="${n.on?"on":""}" data-s="${esc(n.ssid)}" data-sec="${n.secure?1:0}"><span>${esc(n.ssid)}</span><span>${n.on?"Connected":(n.secure?"🔒 ":"")+n.signal+"%"}</span></button>`).join("")||`<p class="hint" style="padding:0 10px">No networks found. Plug in a cable, or check Wi-Fi is switched on.</p>`;
  $$("#nets [data-s]").forEach(b=>b.onclick=()=>{ if(b.classList.contains("on")) return; $$("#nets form").forEach(f=>f.remove()); if(b.dataset.sec==="0") return join(b.dataset.s,"");
    const f=document.createElement("form"); f.innerHTML=`<input type="password" placeholder="Password for ${esc(b.dataset.s)}"><button>Join</button>`; b.after(f); f.querySelector("input").focus(); f.onsubmit=e=>{ e.preventDefault(); join(b.dataset.s,f.querySelector("input").value); }; }); }
async function join(s,p){ notice("Joining "+s+"…"); const r=await api.os_wifi(s,p); notice(r.ok?"Connected to "+s+".":"Couldn't join "+s+": "+(r.msg||"wrong password?"),r.ok?"":"warn"); nets(); tray(); }
function toggleCC(){ const c=$("#cc"); c.classList.toggle("show"); if(c.classList.contains("show")){ $("#nc").classList.remove("show"); nets(); tray(); loadLock(); stats(); } }
$("#tNet").onclick=$("#tVol").onclick=$("#tBat").onclick=e=>{ e.stopPropagation(); toggleCC(); };
document.addEventListener("click",e=>{ const c=$("#cc"); if(c.classList.contains("show")&&!c.contains(e.target)) c.classList.remove("show"); });
$("#vol").oninput=()=>{ $("#volO").textContent=$("#vol").value+"%"; clearTimeout(window._v); window._v=setTimeout(()=>api.os_set({volume:+$("#vol").value}).then(tray),120); };
$("#bri").oninput=()=>{ $("#briO").textContent=$("#bri").value+"%"; clearTimeout(window._b); window._b=setTimeout(()=>api.os_set({brightness:+$("#bri").value}),120); };

/* ============ power ============ */
let pend=null;
function askPower(a){ $("#cc").classList.remove("show"); pend=a; $("#cfT").textContent=a==="restart"?"Restart?":"Shut down?"; $("#cfP").textContent=a==="restart"?"ORION will restart the PC. Anything unsaved in other apps will close.":"ORION will say goodbye and switch the PC off. Anything unsaved in other apps will close.";
  $("#cfYes").textContent=a==="restart"?"Restart":"Shut down"; $("#confirm").classList.add("show"); $("#cfYes").focus(); }
$("#tPow").onclick=e=>{ e.stopPropagation(); toggleCC(); };
$("#pOff").onclick=()=>askPower("shutdown"); $("#pRe").onclick=()=>askPower("restart"); $("#pSleep").onclick=()=>{ $("#cc").classList.remove("show"); goSleep(); };
$("#cfNo").onclick=()=>$("#confirm").classList.remove("show");
$("#cfYes").onclick=()=>{ $("#confirm").classList.remove("show"); farewell(pend); api.os_power(pend); };


/* ============ lock screen ============ */
let LS={pin:false,idle_min:10}, dayL=[];
function paintLock(){ const d=new Date(); $("#lTime").innerHTML=`${String(d.getHours()).padStart(2,"0")}<span>:</span>${String(d.getMinutes()).padStart(2,"0")}`;
  $("#lDate").textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  $("#lNetT").textContent=ST.wired?"Wired":ST.wifi?ST.wifi.ssid:"Offline"; $("#lBat").hidden=!ST.battery; if(ST.battery) $("#lBatT").textContent=(ST.battery.plugged?"⚡ ":"")+ST.battery.pct+"%"; }
setInterval(()=>locked&&paintLock(),1000);
function paintGlance(){ $("#glance").innerHTML=dayL.slice(0,3).map(([c,a,b])=>`<div><i style="background:${c};box-shadow:0 0 10px ${c}"></i>${a}${b?`<small>${b}</small>`:""}</div>`).join(""); }
function paintAway(){ const m=missed.slice(-3); $("#away").innerHTML=m.length?`<h4>While you were away${missed.length>3?` (${missed.length})`:""}</h4>`+m.map(t=>`<p>${esc(t)}</p>`).join(""):""; }
function lock(){ if(locked) return; locked=true; document.body.classList.add("locked"); document.body.classList.remove("unlocking");
  $("#cc").classList.remove("show"); $("#confirm").classList.remove("show"); $("#pinD").classList.remove("show"); closePlace(true);
  $("#lock").classList.remove("askpin"); $("#pinI").value=""; $("#pinE").textContent=""; $("#pinWho").textContent=title;
  paintGlance();
  paintLock(); paintAway(); document.activeElement&&document.activeElement.blur(); try{ api&&api.os_lock("front"); }catch(e){} }
function unlock(){ if(!locked) return; document.body.classList.add("unlocking"); pulse=1.4; try{ api.os_signal("unlock"); }catch(e){}
  setTimeout(()=>{ locked=false; document.body.classList.remove("locked","unlocking"); const m=missed.length; missed=[]; paintAway();
    if(m) setTimeout(()=>notice(`<b>${m} thing${m>1?"s":""} happened while you were away</b>`,"",()=>openPlace("comms")),500); $("#q").focus(); },550); }
function tryWake(){ if(!locked) return; if(!LS.pin) return unlock(); const L=$("#lock"); if(!L.classList.contains("askpin")){ L.classList.add("askpin"); } setTimeout(()=>$("#pinI").focus(),30); }
$("#lock").addEventListener("click",tryWake);
addEventListener("keydown",e=>{ if(locked&&document.activeElement!==$("#pinI")){ e.preventDefault(); e.stopImmediatePropagation(); tryWake(); if(LS.pin&&/^\d$/.test(e.key)) $("#pinI").value+=e.key; } },true);
$("#pinF").onsubmit=async e=>{ e.preventDefault(); const v=$("#pinI").value; if(!v) return; let r={ok:false}; try{ r=await api.os_lock("check",v); }catch(err){}
  if(r.ok) return unlock(); const f=$("#pinF"); f.classList.remove("bad"); void f.offsetWidth; f.classList.add("bad"); $("#pinI").value="";
  $("#pinE").textContent=r.wait?`Too many tries. Wait ${r.wait} seconds.`:"That's not it. Try again."; };
$("#pinI").addEventListener("input",()=>{ $("#pinE").textContent=""; });
addEventListener("keydown",e=>{ if(locked&&e.key==="Escape"){ $("#lock").classList.remove("askpin"); $("#pinI").value=""; $("#pinI").blur(); } });
// auto-lock when the whole PC has been left alone (any app, not just ORION)
let lastIn=Date.now(); ["keydown","pointermove","pointerdown","wheel"].forEach(t=>addEventListener(t,()=>lastIn=Date.now(),true));
setInterval(async()=>{ if(!api||locked) return; try{ const s=await api.os_lock(); LS=s; const idle=s.idle_now!=null?s.idle_now:(Date.now()-lastIn)/1000;
  if(s.idle_min>0&&idle>=s.idle_min*60) lock(); }catch(e){} },15000);
async function loadLock(){ try{ LS=await api.os_lock(); }catch(e){} $("#pPin").textContent=LS.pin?"Change PIN":"Set PIN"; $("#pIdle").value=String(LS.idle_min); }
$("#pLock").onclick=e=>{ e.stopPropagation(); lock(); };
$("#pIdle").onchange=async()=>{ LS=await api.os_lock("idle","","",+$("#pIdle").value); notice(LS.idle_min?`ORION will lock after ${LS.idle_min} minutes away.`:"Auto-lock is off."); };
$("#pPin").onclick=e=>{ e.stopPropagation(); $("#cc").classList.remove("show"); $("#pdOld").hidden=!LS.pin; $("#pdRm").hidden=!LS.pin; $("#pdT").textContent=LS.pin?"Change your PIN":"Set a PIN";
  $("#pdOld").value=$("#pdNew").value=""; $("#pdM").textContent=""; $("#pinD").classList.add("show"); (LS.pin?$("#pdOld"):$("#pdNew")).focus(); };
$("#pdNo").onclick=()=>$("#pinD").classList.remove("show");
async function savePin(newPin){ const r=await api.os_lock("set",newPin,$("#pdOld").value); if(!r.ok){ $("#pdM").textContent=r.msg||"Couldn't save that."; return; }
  $("#pinD").classList.remove("show"); await loadLock(); notice(newPin?"PIN saved. You'll need it to unlock ORION.":"PIN removed. Any key unlocks ORION now."); }
$("#pdOk").onclick=()=>savePin($("#pdNew").value.trim()); $("#pdRm").onclick=()=>savePin("");
$("#pdNew").onkeydown=e=>{ if(e.key==="Enter") $("#pdOk").click(); };

/* ============ skies ============ */
function setSky(k,save){ skyT=k||"night"; document.body.classList.remove("sky-night","sky-aurora","sky-dawn","sky-deep"); document.body.classList.add("sky-"+skyT);
  $$("#skies [data-sky]").forEach(b=>b.classList.toggle("on",b.dataset.sky===skyT)); if(save) api.os_pref("os_sky",skyT); }
$$("#skies [data-sky]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); setSky(b.dataset.sky,true); });

/* ============ PC stats ============ */
async function stats(){ if(!$("#cc").classList.contains("show")) return; let s; try{ s=await api.os_sysinfo(); }catch(e){ return; }
  const up=s.uptime>=3600?Math.floor(s.uptime/3600)+"h "+Math.floor(s.uptime%3600/60)+"m":Math.floor(s.uptime/60)+"m";
  $("#stats").innerHTML=`<div class="${s.cpu>85?"hot":""}"><b>${s.cpu}%</b><small>CPU</small></div><div class="${s.ram>88?"hot":""}"><b>${s.ram}%</b><small>Memory</small></div>`+
    (s.temp!=null?`<div class="${s.temp>80?"hot":""}"><b>${s.temp}°</b><small>Temp</small></div>`:`<div><b>${s.disk_free}</b><small>GB free</small></div>`)+`<div><b>${up}</b><small>On for</small></div>`; }
setInterval(stats,3000);
$("#pShot").onclick=async e=>{ e.stopPropagation(); $("#cc").classList.remove("show"); await new Promise(r=>setTimeout(r,400)); let p=null; try{ p=await api.os_screenshot(); }catch(err){}
  notice(p?"Screenshot saved to Pictures/Screenshots.":"Couldn't take a screenshot.",p?"":"warn"); };

/* ============ notification centre ============ */
let NOTES=[], unread=0, dnd=false;
function remember(text,level){ NOTES.unshift({t:text.replace(/<[^>]+>/g,""),at:new Date(),warn:level==="warn"}); NOTES=NOTES.slice(0,40);
  if(!$("#nc").classList.contains("show")) unread++; paintBell(); if($("#nc").classList.contains("show")) paintNC(); }
function paintBell(){ $("#bellN").textContent=unread?String(Math.min(unread,99)):""; }
function paintNC(){ $("#nlist").innerHTML=NOTES.length?NOTES.map(n=>`<div class="${n.warn?"warn":""}">${esc(n.t)}<small>${n.at.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</small></div>`).join(""):`<p>Nothing yet. ORION's messages will collect here.</p>`;
  $("#ncDnd").classList.toggle("on",dnd); $("#ncDnd").textContent=dnd?"Do not disturb is on":"Do not disturb"; }
function setDnd(v,save){ dnd=!!v; document.body.classList.toggle("dnd",dnd); paintNC(); if(save){ api.os_pref("os_dnd",dnd); } }
$("#tBell").onclick=e=>{ e.stopPropagation(); $("#cc").classList.remove("show"); const n=$("#nc"); n.classList.toggle("show"); if(n.classList.contains("show")){ unread=0; paintBell(); paintNC(); } };
$("#ncClr").onclick=e=>{ e.stopPropagation(); NOTES=[]; paintNC(); };
$("#ncDnd").onclick=e=>{ e.stopPropagation(); setDnd(!dnd,true); notice(dnd?"Do not disturb is on. Messages wait quietly in notifications.":"Do not disturb is off."); };
document.addEventListener("click",e=>{ const n=$("#nc"); if(n.classList.contains("show")&&!n.contains(e.target)) n.classList.remove("show"); });

/* ============ files ============ */
const FICON=n=>/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(n)?"🖼":/\.(mp4|mkv|webm|mov|avi)$/i.test(n)?"🎬":/\.(mp3|wav|ogg|flac|m4a)$/i.test(n)?"🎵":/\.pdf$/i.test(n)?"📄":/\.(docx?|odt|rtf|txt|md)$/i.test(n)?"📝":/\.(xlsx?|csv|ods)$/i.test(n)?"📊":/\.(zip|tar|gz|7z|rar)$/i.test(n)?"🗜":/\.(py|js|html|css|json|sh)$/i.test(n)?"💻":"▫";
const fsize=b=>b>1<<30?(b/(1<<30)).toFixed(1)+" GB":b>1<<20?(b/(1<<20)).toFixed(1)+" MB":b>1024?Math.round(b/1024)+" KB":b+" B";
let FPATH="";
async function loadFiles(path){ FPATH=path||""; let r={path:"",items:[]}; try{ r=await api.os_files(FPATH); }catch(e){} FPATH=r.path||"";
  $("#fbar").innerHTML=["","Documents","Downloads","Pictures","Music","Videos","Desktop"].map(f=>`<button data-f="${f}" class="${FPATH===f?"on":""}">${f||"Home"}</button>`).join("");
  $$("#fbar [data-f]").forEach(b=>b.onclick=()=>loadFiles(b.dataset.f));
  const parts=FPATH?FPATH.split("/"):[]; $("#crumbs").innerHTML=`<button data-c="">Home</button>`+parts.map((p,i)=>`›<button data-c="${esc(parts.slice(0,i+1).join("/"))}">${esc(p)}</button>`).join("");
  $$("#crumbs [data-c]").forEach(b=>b.onclick=()=>loadFiles(b.dataset.c));
  $("#flist").innerHTML=r.items.length?r.items.map(f=>`<button data-n="${esc(f.name)}" data-d="${f.dir?1:0}"><em>${f.dir?"📁":FICON(f.name)}</em><span>${esc(f.name)}</span><small>${f.dir?"":fsize(f.size)}</small><small>${new Date(f.mtime*1000).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</small></button>`).join(""):`<p class="hint">This folder is empty.</p>`;
  $$("#flist [data-n]").forEach(b=>b.onclick=()=>{ const p=(FPATH?FPATH+"/":"")+b.dataset.n; if(b.dataset.d==="1") loadFiles(p); else { api.os_open(p); notice("Opening "+b.dataset.n+". Press the Windows key to come back."); } }); }

/* ============ power countdown (automations, or when you ask) ============ */
let CD=null;
function countdown(action,secs,why){ clearInterval(CD&&CD.t); const W={shutdown:"Shutting down",restart:"Restarting",sleep:"Going to sleep"};
  CD={action,n:secs}; $("#cdWhat").textContent=W[action]||"Shutting down"; $("#cdN").textContent=secs; $("#cdWhy").textContent=why?`${why}. Save anything you're working on.`:"Save anything you're working on.";
  $("#count").classList.add("show"); try{ api.os_lock("front"); }catch(e){}
  CD.t=setInterval(()=>{ CD.n--; $("#cdN").textContent=CD.n; if(CD.n<=0){ clearInterval(CD.t); $("#count").classList.remove("show"); doPower(CD.action); } },1000); }
$("#cdNo").onclick=()=>{ clearInterval(CD&&CD.t); $("#count").classList.remove("show"); notice("Cancelled. The PC stays on."); };
$("#cdNow").onclick=()=>{ clearInterval(CD&&CD.t); $("#count").classList.remove("show"); doPower(CD.action); };
function doPower(a){ if(a==="sleep") return goSleep(); api.os_power(a); }
function goSleep(){ lock(); const c=$("#curtain"); c.querySelector("p").textContent="SLEEPING"; c.classList.remove("gone"); setTimeout(()=>api.os_power("sleep"),900); setTimeout(()=>c.classList.add("gone"),2600); }

/* ============ farewell: Orion folds into its belt and goes out ============ */
function farewell(kind){ if(fare) return; fareK=kind||"shutdown"; document.body.classList.add("leaving"); clearInterval(CD&&CD.t);
  $("#byeT").textContent=fareK==="restart"?"SEE YOU SHORTLY":"GOODBYE"; $("#byeS").textContent=fareK==="restart"?`Restarting, ${title}.`:`Powering down, ${title}.`;
  setTimeout(()=>{ fare=performance.now(); },900); setTimeout(()=>$("#bye").classList.add("show"),2100);
  setTimeout(()=>{ $("#bye").classList.remove("show"); document.body.classList.add("gone-dark"); const c=$("#curtain"); c.querySelector("p").textContent=""; c.classList.remove("gone"); },5600); }
/* ============ start ============ */
window.OS_HUB=()=>{};
async function start(){ window.OS_API=api; let c={}; try{ c=await api.init(); }catch(e){} title=c.title||"sir"; setSky(c.os_sky||"night"); setDnd(!!c.os_dnd); try{ api.os_signal("os_start"); }catch(e){}
  tickClock(); loadDay(); tray(); setInterval(loadDay,60000); setInterval(tray,5000);
  await loadLock(); lock();
  setTimeout(()=>{ $("#curtain").classList.add("gone"); boot0=performance.now(); },400);
  }
