<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORION mini</title>
<style>
:root{--a:#3fd8ff;--a2:#8af5ff;--ar:63,216,255}
body[data-theme=serious]{--a:#ff3d4a;--a2:#ff9096;--ar:255,61,74}
body[data-theme=stealth]{--a:#b9c4cc;--a2:#eef3f6;--ar:185,196,204}
body[data-theme=executive]{--a:#e9b949;--a2:#ffe29a;--ar:233,185,73}
body[data-theme=hacker]{--a:#2bff88;--a2:#a6ffcf;--ar:43,255,136}
body.thinking{--a:#ffb347;--a2:#ffd48a;--ar:255,179,71}
body.listening{--a:#ff4f7b;--a2:#ff9ab3;--ar:255,79,123}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02060b;user-select:none;font-family:"Segoe UI",system-ui,sans-serif}
.orb{position:absolute;inset:10px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.orb i,.orb b,.orb s{position:absolute;border-radius:50%}
.orb i{inset:0;border:2px dashed var(--a);animation:spin 12s linear infinite;opacity:.8}
.orb b{inset:12px;border:2px solid var(--a2);border-top-color:transparent;border-bottom-color:transparent;animation:spin 3s linear infinite reverse}
.orb s{inset:30px;background:radial-gradient(circle,var(--a2),rgba(var(--ar),.25) 65%,transparent 72%);box-shadow:0 0 30px rgba(var(--ar),.7);animation:pulse 3s ease-in-out infinite}
body.thinking .orb i{animation-duration:1.5s}body.thinking .orb s{animation-duration:.8s}
body.speaking .orb s{animation-duration:.45s}
body.listening .orb s{animation-duration:.6s}
#lbl{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:700 9px/1 "Segoe UI";letter-spacing:.3em;color:var(--a2);text-shadow:0 0 8px var(--a)}
#tip{position:absolute;left:4px;right:4px;top:4px;font:11px/1.3 "Segoe UI";color:#dff6ff;background:rgba(4,14,24,.92);border:1px solid rgba(var(--ar),.5);border-radius:6px;padding:5px 7px;display:none;max-height:70px;overflow:hidden}
#tip.show{display:block;animation:fade .2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.85}50%{transform:scale(1.06);opacity:1}}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div class="orb pywebview-drag-region" id="orb" title="Click: talk · Double-click: open ORION · Drag: move"><i></i><b></b><s></s></div>
<div id="lbl">ORION</div>
<div id="tip"></div>
<script>
let api=null, mic=false, clickT=null;
const $=s=>document.querySelector(s);
function tip(t){ const d=$("#tip"); d.textContent=t; d.classList.add("show"); clearTimeout(d._t); d._t=setTimeout(()=>d.classList.remove("show"),5000); }
window.ui={event(e){
  if(e.kind==="state"){ document.body.classList.remove("thinking","listening"); if(e.state!=="idle") document.body.classList.add(e.state); $("#lbl").textContent=e.state==="thinking"?"WORKING":e.state==="listening"?"LISTENING":"ORION"; }
  if(e.kind==="speaking") document.body.classList.toggle("speaking",!!e.on);
  if(e.kind==="theme") document.body.dataset.theme=e.theme;
  if(e.kind==="toast") tip(e.text);
  if(e.kind==="hearing") tip("“"+e.text+"”");
  if(e.kind==="stream_end"&&e.text) tip(e.text);
}};
$("#orb").addEventListener("click",()=>{ clearTimeout(clickT); clickT=setTimeout(()=>{ if(api) api.mic_start(); },230); });
$("#orb").addEventListener("dblclick",()=>{ clearTimeout(clickT); api&&api.mini_toggle(); });
window.addEventListener("pywebviewready",()=>{ api=window.pywebview.api; api.init().then(c=>document.body.dataset.theme=c.theme); });
</script>
</body>
</html>
